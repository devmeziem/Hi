name: Kaggle Clip Poll + Stitch

on:
  workflow_dispatch:
    inputs:
      kernel_slug:
        description: 'Kaggle kernel slug (username/hi-ai-clip-worker). Leave blank to use KAGGLE_USERNAME secret.'
        required: false
        default: ''
      wait_minutes:
        description: 'Max minutes to poll for COMPLETE'
        required: false
        default: '20'

jobs:
  poll:
    name: Poll Kaggle output + download clips
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q 'kaggle>=1.6.0' six protobuf urllib3 certifi python-dateutil requests tqdm
      - name: Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_USERNAME"
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo -n "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          fi
          if [ -n "$KAGGLE_KEY" ]; then
            printf '%s\n' "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi
          SLUG="${{ github.event.inputs.kernel_slug }}"
          if [ -z "$SLUG" ]; then SLUG="$KAGGLE_USERNAME/hi-ai-clip-worker"; fi
          echo "KERNEL_SLUG=$SLUG" >> $GITHUB_ENV
          echo "Polling $SLUG"
      - name: Poll until complete
        env:
          WAIT_MIN: ${{ github.event.inputs.wait_minutes || '20' }}
        run: |
          echo "Polling $KERNEL_SLUG ..."
          END=$((SECONDS + WAIT_MIN * 60))
          while [ $SECONDS -lt $END ]; do
            OUT=$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)
            echo "$OUT"
            if echo "$OUT" | grep -qiE 'complete|completed|success'; then
              echo "COMPLETE"
              break
            fi
            if echo "$OUT" | grep -qiE 'error|failed'; then
              echo "Kernel reported error"
              exit 1
            fi
            sleep 30
          done
      - name: Download output
        run: |
          mkdir -p kaggle_out
          kaggle kernels output "$KERNEL_SLUG" -p kaggle_out || true
          ls -laR kaggle_out || true
          find kaggle_out -type f | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: kaggle-clips-${{ github.run_id }}
          path: kaggle_out/**
          if-no-files-found: warn
