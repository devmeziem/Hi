name: Kaggle Clip Poll + Stitch

on:
  workflow_dispatch:
    inputs:
      kernel_slug:
        description: 'Kaggle kernel slug (username/hi-ai-clip-worker). Blank = secret username.'
        required: false
        default: ''
      wait_minutes:
        description: 'Max minutes to poll for COMPLETE'
        required: false
        default: '25'

jobs:
  poll:
    name: Poll Kaggle + stitch master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -q 'kaggle>=1.6.0' six protobuf urllib3 certifi python-dateutil requests tqdm
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg || true
      - name: Credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_USERNAME"
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then echo -n "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token; fi
          if [ -n "$KAGGLE_KEY" ]; then printf '%s\n' "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json; chmod 600 ~/.kaggle/kaggle.json; fi
          SLUG="${{ github.event.inputs.kernel_slug }}"
          if [ -z "$SLUG" ]; then SLUG="$KAGGLE_USERNAME/hi-ai-clip-worker"; fi
          echo "KERNEL_SLUG=$SLUG" >> $GITHUB_ENV
          echo "Polling $SLUG"
      - name: Poll until complete
        env:
          WAIT_MIN: ${{ github.event.inputs.wait_minutes || '25' }}
        run: |
          END=$((SECONDS + WAIT_MIN * 60))
          while [ $SECONDS -lt $END ]; do
            OUT=$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)
            echo "$OUT"
            if echo "$OUT" | grep -qiE 'complete|completed|success'; then echo COMPLETE; break; fi
            if echo "$OUT" | grep -qiE 'error|failed'; then echo Kernel error; exit 1; fi
            sleep 25
          done
      - name: Download + stitch
        run: |
          mkdir -p kaggle_out rendered_videos
          kaggle kernels output "$KERNEL_SLUG" -p kaggle_out || true
          ls -laR kaggle_out || true
          # collect mp4s
          find kaggle_out -type f -name '*.mp4' | sort > /tmp/mp4s.txt || true
          cat /tmp/mp4s.txt || true
          COUNT=$(wc -l < /tmp/mp4s.txt | tr -d ' ')
          echo "mp4_count=$COUNT"
          if [ "$COUNT" -ge 1 ]; then
            i=0
            while read -r f; do
              cp -f "$f" "rendered_videos/kaggle_clip_$(printf '%02d' $i).mp4"
              i=$((i+1))
            done < /tmp/mp4s.txt
            # stitch all non-tiny
            : > /tmp/concat.txt
            for f in rendered_videos/kaggle_clip_*.mp4; do
              sz=$(stat -c%s "$f" 2>/dev/null || echo 0)
              if [ "$sz" -gt 40000 ]; then echo "file '$f'" >> /tmp/concat.txt; fi
            done
            if [ -s /tmp/concat.txt ]; then
              ffmpeg -y -f concat -safe 0 -i /tmp/concat.txt -c copy rendered_videos/kaggle_storm_stitched.mp4 || true
              ffmpeg -y -i rendered_videos/kaggle_storm_stitched.mp4 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -an rendered_videos/kaggle_storm_master.mp4 || true
            fi
          fi
          # fallback: build GH storm pack if kaggle empty/black
          NEED_FALLBACK=0
          if [ ! -f rendered_videos/kaggle_storm_master.mp4 ]; then NEED_FALLBACK=1; fi
          if [ -f rendered_videos/kaggle_storm_master.mp4 ]; then
            SZ=$(stat -c%s rendered_videos/kaggle_storm_master.mp4)
            if [ "$SZ" -lt 100000 ]; then NEED_FALLBACK=1; fi
          fi
          if [ "$NEED_FALLBACK" = "1" ]; then
            echo "Kaggle output weak — generating GH cinematic storm pack"
            STORM_CLIPS=4 STORM_SEC=5 node scripts/generate_cinematic_storm_pack.cjs
            cp -f rendered_videos/storm_pack_master.mp4 rendered_videos/kaggle_storm_master.mp4 || true
          fi
          ls -lh rendered_videos/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: kaggle-storm-final-${{ github.run_id }}
          path: |
            rendered_videos/kaggle_storm_master.mp4
            rendered_videos/kaggle_storm_stitched.mp4
            rendered_videos/kaggle_clip_*.mp4
            rendered_videos/storm_pack_master.mp4
            rendered_videos/storm_clip_*.mp4
            rendered_videos/storm_pack_meta.json
            kaggle_out/**
          if-no-files-found: warn
