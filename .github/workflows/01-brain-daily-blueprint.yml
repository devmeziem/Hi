name: 01-voxam-brain-daily-blueprint

# on:
#   schedule:
#     # Runs at 12:00 AM UTC (01:00 AM WAT) every day
#     - cron: '0 0 * * *'
on:
  workflow_dispatch:

jobs:
  generate-daily-blueprints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || npm install --force || true

      - name: Run The Brain (Grok 2 / Groq LPU / Gemini 2.5)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_KEY: ${{ secrets.GROK_KEY }}
          XAI_API_KEY_2: ${{ secrets.XAI_API_KEY_2 }}
          GROK_API_KEY_2: ${{ secrets.GROK_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
        run: |
          node scripts/brain_daily_generator.cjs
          echo "Daily Blueprint generation complete. Clean runner state verified."

      - name: Runner Cleanup
        if: always()
        run: |
          rm -rf /tmp/voxam_* /tmp/*.tmp 2>/dev/null || true
