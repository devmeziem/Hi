name: 02-voxam-media-asset-engine

# on:
#   schedule:
#     # Runs every 30 minutes to process queued jobs
#     - cron: '*/30 * * * *'
on:
  workflow_dispatch:

jobs:
  synthesize-images-and-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || npm install --force || true

      - name: Synthesize 1080x1920 Visuals & Deepgram Voice Audio
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          node scripts/asset_generator_queue.cjs
          echo "Assets uploaded to Cloudinary. Job updated to READY_FOR_RENDER"
