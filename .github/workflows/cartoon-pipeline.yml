name: Automated Cartoon Factory (Workflow 3)

on:
  push:
    branches:
      - main
      - master
  schedule:
    # Strict 4x daily Archie releases: 1 Animated Video (13:00 UTC) + 3 Everyday Science Fact Reels (08:00, 18:00, 23:00 UTC)
    - cron: '0 8,13,18,23 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Cartoon Topic / Wonder (e.g., "Why Microwaves Heat Soup Not Mugs", "Why Onions Make You Cry")'
        required: false
        default: ''
        type: string
      video_mode:
        description: 'Video Generation Mode (auto | video | fact_reel | all_daily_4)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - video
          - fact_reel
          - all_daily_4
      engine:
        description: 'Rendering Engine (moviepy for exact puppet character animation, ffmpeg for ultra-fast 2.5D, blender for 3D cutout)'
        required: false
        default: 'moviepy'
        type: choice
        options:
          - moviepy
          - ffmpeg
          - blender
      pause_youtube:
        description: 'Pause YouTube Upload (Focus on Facebook & Instagram Buffer testing)'
        required: false
        default: true
        type: boolean
      buffer_token:
        description: 'Buffer Access Token (Optional: paste your token here to test directly)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run Mode (Uncheck for live publishing)'
        required: true
        default: false
        type: boolean

jobs:
  cartoon_factory_pipeline:
    name: Build & Validate Cartoon Episode
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python Environment for Kokoro ONNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Utilities & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libespeak-ng1 libsndfile1

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Python Neural Audio & Video Packages
        run: |
          pip install --no-cache-dir kokoro-onnx soundfile moviepy pillow numpy

      - name: Cache & Download Kokoro-82M ONNX Models
        run: |
          sudo mkdir -p /opt/kokoro_models
          sudo chmod 777 /opt/kokoro_models
          if [ ! -f /opt/kokoro_models/kokoro-v1.0.onnx ]; then
            echo "Downloading kokoro-v1.0.onnx..."
            curl -sL "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" -o /opt/kokoro_models/kokoro-v1.0.onnx
          fi
          if [ ! -f /opt/kokoro_models/voices-v1.0.bin ]; then
            echo "Downloading voices-v1.0.bin..."
            curl -sL "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" -o /opt/kokoro_models/voices-v1.0.bin
          fi
          ls -lh /opt/kokoro_models

      - name: Install Rhubarb Lip Sync 1.13.0
        run: |
          curl -sL "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip" -o rhubarb.zip
          unzip -q rhubarb.zip -d rhubarb_bin
          RHUBARB_PATH=$(find rhubarb_bin -name rhubarb -type f | head -n 1)
          if [ -n "$RHUBARB_PATH" ]; then
            sudo cp "$RHUBARB_PATH" /usr/local/bin/rhubarb
            sudo chmod +x /usr/local/bin/rhubarb
            echo "Rhubarb Lip Sync installed successfully to /usr/local/bin/rhubarb."
          fi
          rm -rf rhubarb.zip rhubarb_bin

      - name: Verify Environment Binaries
        run: |
          echo "=== VERIFYING PIPELINE BINARIES ==="
          ffmpeg -version | head -n 1
          rhubarb --version || echo "Rhubarb check finished"
          python3 -c "import kokoro_onnx; print('Kokoro-ONNX ready')"

      - name: Pre-Compile Exact Puppet Character Rig Assets
        run: |
          echo "=== PRE-COMPILING EXACT PUPPET VECTOR & RASTER ASSETS ==="
          node scripts/build_exact_puppet_shapes.cjs
          node scripts/build_modern_tech_character.cjs
          ls -la cartoon_character_assets/exact_puppet/

      - name: Discover and Cache Working AI Models (Groq & OpenRouter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== Discovering Active Groq & OpenRouter Models ==="
          node scripts/groq_model_finder.cjs || true
          node scripts/openrouter_model_finder.cjs || true

      - name: Execute Archie Video Production (1 Video Per Trigger to Prevent Spam)
        env:
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'auto' }}
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          CARTOON_ENGINE: ${{ github.event.inputs.engine || 'moviepy' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          ALLOW_SHARED_YOUTUBE_TOKEN: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_API_KEY_2: ${{ secrets.GROK_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 }}
          YOUTUBE_CLIENT_ID_TECH: ${{ secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET_TECH: ${{ secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN_TECH: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 || secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 || secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 || secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          PAUSE_YOUTUBE: ${{ github.event.inputs.pause_youtube || 'true' }}
          BUFFER_API_KEY: ${{ github.event.inputs.buffer_token || secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID || '6aa31cd2cd8b9c702c468b52' }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
        run: |
          CURRENT_HOUR=$(date -u +%-H)
          echo "=== Processing Archie Video Dispatch (Event: ${{ github.event_name }}, Mode: $VIDEO_MODE, Hour: $CURRENT_HOUR UTC, Pause YouTube: $PAUSE_YOUTUBE) ==="
          
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "🚀 Push event detected! Initiating immediate Archie Reel generation & omnichannel release..."
            node scripts/generate_archie_tech_fact_reel.cjs
          elif [ "$VIDEO_MODE" = "video" ] || [ "$VIDEO_MODE" = "episode" ] || { [ "$VIDEO_MODE" = "auto" ] && [ "$CURRENT_HOUR" -eq 13 ]; }; then
            echo "▶️ Generating 1 Full Archie Animated Cartoon Video..."
            node scripts/test_cartoon_runner.cjs
          elif [ "$VIDEO_MODE" = "fact_reel" ] || { [ "$VIDEO_MODE" = "auto" ] && [ "$CURRENT_HOUR" -ne 13 ]; }; then
            echo "▶️ Generating 1 Archie Everyday Science / Tech Fact Reel..."
            node scripts/generate_archie_tech_fact_reel.cjs
          elif [ "$VIDEO_MODE" = "all_daily_4" ]; then
            echo "▶️ Generating Full Daily 4-Video Suite (1 Animated Video + 3 Everyday Fact Reels)..."
            echo "--- Slot 1: Everyday Fact Reel 1 of 3 ---"
            node scripts/generate_archie_tech_fact_reel.cjs || true
            echo "--- Slot 2: Full Animated Video ---"
            node scripts/test_cartoon_runner.cjs || true
            echo "--- Slot 3: Everyday Fact Reel 2 of 3 ---"
            node scripts/generate_archie_tech_fact_reel.cjs || true
            echo "--- Slot 4: Everyday Fact Reel 3 of 3 ---"
            node scripts/generate_archie_tech_fact_reel.cjs || true
          else
            echo "▶️ Defaulting to Archie Everyday Fact Reel..."
            node scripts/generate_archie_tech_fact_reel.cjs
          fi

      - name: Cross-Post to Facebook (Voxam Fact), Instagram (bones_ceo) and TikTok via Buffer
        if: success()
        env:
          PAUSE_YOUTUBE: ${{ github.event.inputs.pause_youtube || 'true' }}
          BUFFER_API_KEY: ${{ github.event.inputs.buffer_token || secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID || '6aa31cd2cd8b9c702c468b52' }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DISPATCHING ARCHIE VIDEO TO BUFFER USING A PUBLIC GITHUB RELEASE AS MEDIA HOST ==="
          node scripts/list_buffer_channels.cjs || true
          node scripts/publish_archie_to_buffer_omnichannel.cjs || echo "Buffer omnichannel step completed with notice."

      - name: Upload Production Video & Diagnostics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-episode-output-${{ github.run_id }}
          path: |
            rendered_videos/*.mp4
            public/rendered_videos/*.mp4
            test_artifacts/archie_5s_reels/*.mp4
            test_artifacts/archie_tech_fact_5s_latest.mp4
            test_artifacts/cartoon_episode_plan.json
            test_artifacts/validation_report.json
            test_artifacts/subtitles.srt
            test_artifacts/factory_job_record.json
          retention-days: 14

      - name: Commit & Push Daily Blueprint Manifest & Weekly Keep-Alive
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/activity_logs
          LOG_FILE=".github/activity_logs/weekly_keepalive.md"
          
          # Perform weekly commit to keep GitHub Actions active
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF_DAYS=$(( (NOW - LAST_COMMIT_DATE) / 86400 ))
          DAY_OF_WEEK=$(date -u +%u) # 7 = Sunday
          
          if [ "$DIFF_DAYS" -ge 6 ] || [ "$DAY_OF_WEEK" -eq 7 ]; then
            echo "Weekly keepalive commit triggered (diff: $DIFF_DAYS days, day: $DAY_OF_WEEK)..."
            echo "# GitHub Actions Weekly Keepalive Log" > "$LOG_FILE"
            echo "Keepalive Heartbeat: $(date -u)" >> "$LOG_FILE"
            echo "Workflow: Cartoon Animation Factory (${{ github.run_number }})" >> "$LOG_FILE"
            git add "$LOG_FILE"
          fi
          
          if [ -f daily_blueprint_manifest.json ]; then
            git add -f daily_blueprint_manifest.json
          fi
          
          if git diff --staged --quiet; then
            echo "No changes staged for commit."
          else
            git commit -m "chore(sync): automated cartoon manifest and weekly keepalive [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Cleanup Local Temporary Blobs
        if: always()
        run: |
          rm -rf test_artifacts/*.wav test_artifacts/*.svg test_artifacts/*.mp3
          echo "Temporary media blobs cleaned up."
