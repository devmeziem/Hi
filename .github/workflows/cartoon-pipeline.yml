name: Automated Cartoon Factory (Workflow 3)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Cartoon Topic / Wonder (e.g., "How Wi-Fi Works", "Why the Ocean is Blue")'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run Mode (True = Validate and preserve artifacts only; False = Dispatch to publisher)'
        required: true
        default: true
        type: boolean

jobs:
  cartoon_factory_pipeline:
    name: Build & Validate Cartoon Episode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || npm install --force || true

      - name: Install FFmpeg Media Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Rhubarb Lip Sync
        run: |
          curl -sL "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip" -o rhubarb.zip
          unzip -q rhubarb.zip -d rhubarb_bin || true
          if [ -f rhubarb_bin/rhubarb ]; then
            sudo cp rhubarb_bin/rhubarb /usr/local/bin/
            sudo chmod +x /usr/local/bin/rhubarb
            echo "Rhubarb Lip Sync installed successfully."
          fi
          rm -rf rhubarb.zip rhubarb_bin

      - name: Verify Environment Binaries
        run: |
          ffmpeg -version | head -n 1
          rhubarb --version 2>/dev/null || echo "Rhubarb fallback active"

      - name: Execute Cartoon Factory Pipeline
        env:
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 }}
        run: node scripts/test_cartoon_runner.cjs

      - name: Upload Production Video & Diagnostics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-episode-output-${{ github.run_id }}
          path: |
            rendered_videos/*.mp4
            test_artifacts/cartoon_episode_plan.json
            test_artifacts/validation_report.json
            test_artifacts/subtitles.srt
          retention-days: 14

      - name: Cleanup Local Temporary Blobs
        if: always()
        run: |
          rm -rf test_artifacts/*.wav test_artifacts/*.svg test_artifacts/*.mp3
          echo "Temporary media blobs cleaned up."
