name: Automated Cartoon Factory (Workflow 3)

on:
  schedule:
    - cron: '0 8,13,18,23 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean

jobs:
  cartoon_factory_pipeline:
    name: Build Archie Episode (simple only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libsndfile1 || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/build_exact_puppet_shapes.cjs || true
      - run: node scripts/apply_all_content_system.cjs || true
      - name: Archie simple path ONLY (no multi-scene fallback)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' }}
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: node scripts/generate_archie_simple_reel.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archie-${{ github.run_id }}
          path: |
            rendered_videos/archie_*.mp4
            test_artifacts/archie_simple/**
          if-no-files-found: ignore
