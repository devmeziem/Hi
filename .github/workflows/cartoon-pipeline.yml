name: Automated Cartoon Factory (Workflow 3)

on:
  schedule:
    - cron: '0 8,14,20 * * *' # Automated 3x daily Cartoon / Tech Animated Shorts (08:00, 14:00, 20:00 UTC)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Cartoon Topic / Wonder (e.g., "How Undersea Cables Connect the Internet", "How GPUs Render Games")'
        required: false
        default: ''
        type: string
      engine:
        description: 'Rendering Engine (ffmpeg for ultra-fast reliable 2.5D animation, blender for 3D cutout)'
        required: false
        default: 'ffmpeg'
        type: choice
        options:
          - ffmpeg
          - blender
      dry_run:
        description: 'Dry Run Mode (Uncheck for live YouTube Tech Channel upload)'
        required: true
        default: false
        type: boolean

jobs:
  cartoon_factory_pipeline:
    name: Build & Validate Cartoon Episode
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python Environment for Kokoro ONNX
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Utilities & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libespeak-ng1 libsndfile1

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Python Neural Audio Packages
        run: |
          pip install --no-cache-dir kokoro-onnx soundfile

      - name: Cache & Download Kokoro-82M ONNX Models
        run: |
          sudo mkdir -p /opt/kokoro_models
          sudo chmod 777 /opt/kokoro_models
          if [ ! -f /opt/kokoro_models/kokoro-v1.0.onnx ]; then
            echo "Downloading kokoro-v1.0.onnx..."
            curl -sL "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx" -o /opt/kokoro_models/kokoro-v1.0.onnx
          fi
          if [ ! -f /opt/kokoro_models/voices-v1.0.bin ]; then
            echo "Downloading voices-v1.0.bin..."
            curl -sL "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin" -o /opt/kokoro_models/voices-v1.0.bin
          fi
          ls -lh /opt/kokoro_models

      - name: Install Rhubarb Lip Sync 1.13.0
        run: |
          curl -sL "https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip" -o rhubarb.zip
          unzip -q rhubarb.zip -d rhubarb_bin
          RHUBARB_PATH=$(find rhubarb_bin -name rhubarb -type f | head -n 1)
          if [ -n "$RHUBARB_PATH" ]; then
            sudo cp "$RHUBARB_PATH" /usr/local/bin/rhubarb
            sudo chmod +x /usr/local/bin/rhubarb
            echo "Rhubarb Lip Sync installed successfully to /usr/local/bin/rhubarb."
          fi
          rm -rf rhubarb.zip rhubarb_bin

      - name: Install Headless Blender 3.3 LTS
        run: |
          sudo mkdir -p /opt/blender
          curl -sL "https://download.blender.org/release/Blender3.3/blender-3.3.1-linux-x64.tar.xz" -o blender.tar.xz
          sudo tar -xf blender.tar.xz -C /opt/blender --strip-components=1
          sudo ln -sf /opt/blender/blender /usr/local/bin/blender
          sudo chmod +x /usr/local/bin/blender
          rm -f blender.tar.xz

      - name: Verify Environment Binaries
        run: |
          echo "=== VERIFYING COLD PIPELINE BINARIES ==="
          ffmpeg -version | head -n 1
          rhubarb --version || echo "Rhubarb check finished"
          blender -v | head -n 1
          python3 -c "import kokoro_onnx; print('Kokoro-ONNX ready')"

      - name: Setup Local Open-Source AI Engine (Ollama Zero-Key Fallback)
        run: |
          echo "=== Setting up Ollama for Local AI Inference ==="
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          if curl -s -f http://127.0.0.1:11434/api/tags; then
            echo "Ollama service started. Pulling model..."
            ollama pull qwen2.5:1.5b || ollama pull qwen2.5:0.5b
          else
            echo "::error::Ollama daemon failed to initialize on port 11434. Logs below:"
            cat /tmp/ollama.log
            exit 1
          fi

      - name: Execute Cartoon Factory Pipeline
        env:
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          CARTOON_ENGINE: ${{ github.event.inputs.engine || 'ffmpeg' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_API_KEY_2: ${{ secrets.GROK_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 }}
          YOUTUBE_CLIENT_ID_TECH: ${{ secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET_TECH: ${{ secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN_TECH: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/test_cartoon_runner.cjs

      - name: Upload Production Video & Diagnostics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-episode-output-${{ github.run_id }}
          path: |
            rendered_videos/*.mp4
            test_artifacts/cartoon_episode_plan.json
            test_artifacts/validation_report.json
            test_artifacts/subtitles.srt
          retention-days: 14

      - name: Commit & Push Daily Blueprint Manifest & Weekly Keep-Alive
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/activity_logs
          LOG_FILE=".github/activity_logs/weekly_keepalive.md"
          
          # Perform weekly commit to keep GitHub Actions active
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF_DAYS=$(( (NOW - LAST_COMMIT_DATE) / 86400 ))
          DAY_OF_WEEK=$(date -u +%u) # 7 = Sunday
          
          if [ "$DIFF_DAYS" -ge 6 ] || [ "$DAY_OF_WEEK" -eq 7 ]; then
            echo "Weekly keepalive commit triggered (diff: $DIFF_DAYS days, day: $DAY_OF_WEEK)..."
            echo "# GitHub Actions Weekly Keepalive Log" > "$LOG_FILE"
            echo "Keepalive Heartbeat: $(date -u)" >> "$LOG_FILE"
            echo "Workflow: Cartoon Animation Factory (${{ github.run_number }})" >> "$LOG_FILE"
            git add "$LOG_FILE"
          fi
          
          if [ -f daily_blueprint_manifest.json ]; then
            git add -f daily_blueprint_manifest.json
          fi
          
          if git diff --staged --quiet; then
            echo "No changes staged for commit."
          else
            git commit -m "chore(sync): automated cartoon manifest and weekly keepalive [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Cleanup Local Temporary Blobs
        if: always()
        run: |
          rm -rf test_artifacts/*.wav test_artifacts/*.svg test_artifacts/*.mp3
          echo "Temporary media blobs cleaned up."
