on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Cartoon Topic / Wonder'
        required: false
        default: ''
        type: string
      video_mode:
        description: 'Video Generation Mode'
        required: false
        default: 'auto'
        type: choice
        options: [auto, video, fact_reel, all_daily_5, all_daily_4]
      engine:
        description: 'Rendering Engine'
        required: false
        default: 'moviepy'
        type: choice
        options: [moviepy, ffmpeg, blender]
      pause_youtube:
        description: 'Pause YouTube Upload'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run Mode'
        required: true
        default: true
        type: boolean

jobs:
