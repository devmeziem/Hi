name: Automated Cartoon Factory (Workflow 3)

# Buffer API1 (Facebook + Instagram) removed — YouTube Channel 3 only.
on:
  schedule:
    - cron: '0 8,13,18,23 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Cartoon Topic / Wonder'
        required: false
        default: ''
        type: string
      video_mode:
        description: 'Video Generation Mode'
        required: false
        default: 'auto'
        type: choice
        options: [auto, video, fact_reel, all_daily_5, all_daily_4]
      engine:
        description: 'Rendering Engine'
        required: false
        default: 'moviepy'
        type: choice
        options: [moviepy, ffmpeg, blender]
      pause_youtube:
        description: 'Pause YouTube Upload'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry Run Mode'
        required: true
        default: false
        type: boolean

jobs:
  cartoon_factory_pipeline:
    name: Build Archie (explainer + YT CH3 only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore Archie generator if corrupt + dual puppet dirs
        run: |
          SZ=$(wc -c < scripts/generate_archie_live_reel.cjs 2>/dev/null || echo 0)
          echo "generator size=$SZ"
          if [ "${SZ:-0}" -lt 5000 ]; then
            curl -fsSL "https://raw.githubusercontent.com/devmeziem/Hi/d9af1beec6711ea04546f04a9de1b88af0ed3c26/scripts/generate_archie_live_reel.cjs" -o scripts/generate_archie_live_reel.cjs
          fi
          node -e "
            const fs=require('fs');
            const p='scripts/generate_archie_live_reel.cjs';
            let t=fs.readFileSync(p,'utf8');
            if (!t.includes('PUPPET_DIRS')) {
              t=t.replace(\"const PUPPET = path.join(process.cwd(), 'cartoon_character_assets', 'exact_puppet');\",\"const PUPPET_DIRS = [path.join(process.cwd(),'cartoon_character_assets','exact_puppet'),path.join(process.cwd(),'cartoon_character_assets','comparison_puppet')];\\nconst PUPPET = PUPPET_DIRS.find(d=>{try{return fs.existsSync(d)&&fs.readdirSync(d).some(f=>/\\\\.png$/i.test(f))}catch{return false}})||PUPPET_DIRS[0];\");
            }
            fs.writeFileSync(p, t);
          "
          node --check scripts/generate_archie_live_reel.cjs
          ls cartoon_character_assets/exact_puppet/puppet_idle.png cartoon_character_assets/comparison_puppet/puppet_idle.png || true
      - name: Install system deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng libsndfile1 fonts-dejavu-core python3-numpy || true
      - name: Install Node deps
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Pre-compile puppet assets
        run: |
          node scripts/build_exact_puppet_shapes.cjs || true
          node scripts/build_modern_tech_character.cjs || true
      - run: node scripts/fix_shebang_headers.cjs || true
      - run: node scripts/apply_all_content_system.cjs || true
      - run: node scripts/ensure_youtube_dispatcher.cjs || true
      - run: node scripts/apply_unique_bgm_all.cjs || true
      - run: node scripts/fix_fin_archie_tts.cjs || true
      - run: node scripts/patch_archie_assembler_null.cjs || true
      - run: node scripts/apply_archie_gestures_fix.cjs || true
      - run: node scripts/apply_archie_soft_gestures.cjs || true
      - run: node scripts/apply_archie_plain_english_45s.cjs || true
      - run: node scripts/apply_social_duration_caps.cjs || true
      - run: node scripts/apply_style_rotation_all.cjs || true
      - run: node scripts/apply_archie_retention_fix.cjs || true
      - run: node scripts/apply_archie_youtube_comment_fix.cjs || true
      - run: node scripts/apply_gemini_models_refresh.cjs || true
      - name: Repair shebangs after patches
        run: |
          node scripts/fix_shebang_headers.cjs || true
          node --check scripts/generate_archie_live_reel.cjs
      - name: Generate Archie explainer
        env:
          TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' }}
          PAUSE_YOUTUBE: ${{ github.event.inputs.pause_youtube == true || github.event.inputs.pause_youtube == 'true' }}
          SKIP_BUFFER_FB_IG: 'true'
          BROLL_MAX_SEC: '2.6'
          ARCHIE_MAX_SEC: '45'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 || secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 || secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 || secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 || secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 || secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 || secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          SKIP_YOUTUBE_PINNED_COMMENT: 'true'
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          echo "=== Archie plain-English + character (max 45s) ==="
          export ARCHIE_MAX_SEC="${ARCHIE_MAX_SEC:-45}"
          export BROLL_MAX_SEC="${BROLL_MAX_SEC:-2.6}"
          node scripts/generate_archie_live_reel.cjs
      - name: Commit Archie topic history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archie_topic_history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(dedup): archie topic history [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
          fi
      - name: YouTube Channel 3 (Archie)
        continue-on-error: true
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && github.event.inputs.pause_youtube != true && github.event.inputs.pause_youtube != 'true' }}
        env:
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 || secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 || secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 || secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 || secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 || secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 || secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          SKIP_YOUTUBE_PINNED_COMMENT: 'true'
        run: |
          node scripts/ensure_youtube_dispatcher.cjs || true
          node -e "
            try {
              const fs=require('fs');
              const meta=JSON.parse(fs.readFileSync('rendered_videos/archie_latest_meta.json','utf8'));
              const mod=require('./scripts/youtube_channel_dispatcher.cjs');
              if (typeof mod.uploadYouTubeShort !== 'function') process.exit(0);
              mod.uploadYouTubeShort({
                videoPath:'rendered_videos/archie_latest.mp4',
                title:String(meta.title||'Archie Explains').slice(0,95),
                description:String(meta.description||''),
                tags:(meta.hashtags||[]).map(h=>String(h).replace(/^#/,'')),
                channelId:'cartoon_factory'
              }).then(r=>console.log('YT Archie', r)).catch(e=>console.warn(e.message));
            } catch (e) { console.warn(e.message); }
          "
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartoon-episode-output-${{ github.run_id }}
          path: |
            rendered_videos/*.mp4
            rendered_videos/archie_latest_meta.json
            test_artifacts/archie_live/**
            test_artifacts/archie_v2/**
          retention-days: 14
          if-no-files-found: ignore
