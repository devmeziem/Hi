name: Facebook & Instagram Knowledge Cards (Workflow 4)

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      card_style:
        description: 'Style (auto rotates by time)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, branded, photo]
      dry_run:
        description: 'Dry Run Mode'
        required: false
        default: false
        type: boolean

jobs:
  publish_infocards:
    name: Archie static FB/IG (live facts + AI)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl librsvg2-bin fonts-dejavu-core
      - run: npm ci || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate live static post (Wikimedia / news / AI)
        env:
          CARD_STYLE: ${{ github.event.inputs.card_style == 'branded' && 'branded' || github.event.inputs.card_style == 'photo' && 'photo' || '' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          node scripts/generate_archie_static_post.cjs
          test -f test_artifacts/infocard_latest.png
          test -f test_artifacts/infocard_manifest.json
          cat test_artifacts/infocard_manifest.json | head -50

      - name: Commit static dedup history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archie_static_history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(dedup): archie static FB/IG history [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin HEAD || true
          fi

      - name: Publish to Facebook + Instagram (Buffer API 1)
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID || '6aa31cd2cd8b9c702c468b52' }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID || '6aa31c1dcd8b9c702c467a38' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          DRY_RUN: 'false'
        run: node scripts/publish_infocards_to_facebook_instagram.cjs

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archie-static-${{ github.run_id }}
          path: |
            test_artifacts/infocard_latest.png
            test_artifacts/infocard_manifest.json
            test_artifacts/infocards/**
          if-no-files-found: ignore
