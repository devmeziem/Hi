name: Teen Motivation Pipeline

on:
  schedule:
    - cron: '0 7,12,17,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no upload)'
        required: false
        default: false
        type: boolean

jobs:
  teen:
    name: Teen situation reel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation espeak-ng || true
          pip install -q edge-tts
      - name: npm install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Apply patches
        run: |
          node scripts/fix_shebang_headers.cjs || true
          node scripts/apply_all_content_system.cjs || true
          node scripts/apply_unique_bgm_all.cjs || true
          node scripts/apply_style_rotation_all.cjs || true
          node scripts/apply_teen_natural_close.cjs || true
          node scripts/apply_social_duration_caps.cjs || true
          node scripts/apply_gemini_models_refresh.cjs || true
          node --check scripts/generate_teen_situation_reel.cjs
      - name: Generate Teen reel
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' }}
          TEEN_MAX_SEC: '45'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_TEEN || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_TEEN || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_TEEN || secrets.YOUTUBE_REFRESH_TOKEN }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_API_TOKEN_2 || secrets.BUFFER_ACCESS_TOKEN_2 }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS_TEEN }}
          SKIP_BUFFER: 'false'
        run: |
          node scripts/generate_teen_situation_reel.cjs
      - name: Commit history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/teen_topic_history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(dedup): teen topic history [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-output-${{ github.run_id }}
          path: |
            rendered_videos/*teen*
            rendered_videos/*.mp4
            test_artifacts/teen_situation/**
          retention-days: 10
          if-no-files-found: warn
