name: Teen Motivation Pipeline [DISABLED — use Apex Discipline pipeline]

# DISABLED: duplicate of teen-motivation-pipeline.yml (Apex Discipline Channel 5).
# That pipeline owns PD-cartoon lessons + Buffer to bonesceo.
# This file kept only for manual emergency dispatch; no schedule.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no upload)'
        required: false
        default: true
        type: boolean
      confirm_run:
        description: 'Type RUN to actually execute (default is no-op)'
        required: false
        default: ''
        type: string

jobs:
  teen:
    name: Teen PD-cartoon situation reel (legacy)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_run == 'RUN' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System deps
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation || true
          pip install -q edge-tts
      - name: npm install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      # NO apply patches — generator is source of truth
      - name: Verify PD generator
        run: |
          node --check scripts/generate_teen_situation_reel.cjs
          grep -q PD_CARTOON_LESSON_BANK scripts/generate_teen_situation_reel.cjs
      - name: Generate Teen reel
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' }}
          TEEN_MAX_SEC: '40'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          SKIP_BUFFER: 'true'
        run: node scripts/generate_teen_situation_reel.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-legacy-${{ github.run_id }}
          path: |
            rendered_videos/teen_motivation_latest.mp4
            rendered_videos/teen_motivation_meta.json
            test_artifacts/teen_situation/**
          retention-days: 5
          if-no-files-found: warn
