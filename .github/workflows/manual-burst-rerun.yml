name: Manual Burst Rerun (Teen + Driftreel + Archie + Stoic)

on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/burst-rerun.flag'
      - 'triggers/archie-rerun.flag'
      - 'triggers/stoic-fix.flag'

jobs:
  stoic:
    if: contains(github.event.head_commit.message, 'Stoic') || contains(github.event.head_commit.message, 'stoic') || github.event_name == 'workflow_dispatch'
    name: Stoic 5s
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch Stoic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run test-stoic-pipeline.yml -R devmeziem/Hi -f dry_run=false || true
  archie:
    if: contains(github.event.head_commit.message, 'Archie') || contains(github.event.head_commit.message, 'archie') || github.event_name == 'workflow_dispatch'
    name: Archie cartoon
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch Archie
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run cartoon-pipeline.yml -R devmeziem/Hi -f dry_run=false -f pause_youtube=false || true
