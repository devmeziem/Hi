name: Cinema Vanguard - Episodic Movie Series Pipeline (Channel 4)

# MOVIE CHANNEL FULLY PAUSED (Season 1 Finale Episode 4 Released & Closed)
# Push & Schedule triggers disabled to prevent automated runs / spam.
on:
  workflow_dispatch:
    inputs:
      episode_index:
        description: 'Episode Index (0 = Ep 1, 1 = Ep 2, 2 = Ep 3, 3 = The Abyssal Trench [Ep 4 Finale])'
        required: false
        default: '3'
        type: string
      auto_publish:
        description: 'Publish Live to YouTube & TikTok (Default TRUE for Push & Manual)'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'Publish Live to TikTok via Buffer API 2 (Default TRUE)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run Mode (Do not upload or post to CDN)'
        required: true
        default: false
        type: boolean
      sound_url:
        description: 'Custom Soundtrack Audio URL (Optional)'
        required: false
        default: ''
        type: string

jobs:
  movie_brand_pipeline:
    name: Build & Render Episodic Mini-Movie Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Movie Series Status Check (Channel 4 Paused & Video Seed Deleted)
        run: |
          echo "=== ⏸️ Cinema Vanguard (Channel 4) is permanently paused. ==="
          echo "Season 1 Finale (Episode 4) has been posted. Video seed & auto generation completely deleted."
          exit 0

      - name: Dispatch to Movie Brand TikTok Channel (Buffer API 2)
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.publish_tiktok != 'false')
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID || secrets.BUFFER_TIKTOK_MOVIE_CHANNEL || secrets.BUFFER_TIKTOK_CHANNEL_ID_MOVIE || secrets.BUFFER_TIKTOK_CHANNEL_ID_1 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 📱 Publishing Movie Episode to TikTok via Buffer API 2 ==="
          node scripts/publish_buffer_second_tiktok.cjs movie_brand

      - name: Delete Episode 4 Video Files Post-Upload
        if: always()
        run: |
          echo "=== 🗑️ Post-Upload Cleanup: Deleting Episode 4 video files as requested ==="
          rm -f rendered_videos/movie_episode* test_artifacts/movie_episodes/*.mp4 test_artifacts/movie_episodes/*.wav
          echo "=== Episode 4 Video Files Deleted Post-Upload ==="

      - name: Archive Movie Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-episode-reel-${{ github.run_id }}
          path: |
            test_artifacts/movie_episodes_manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Pipeline Summary (Zero Git Commits, Low Key Database Logging)
        if: always()
        run: |
          echo "==============================================================="
          echo "PROTOCOL ZERO EPISODIC ENGINE PIPELINE COMPLETED"
          echo "Zero git commits made to repository - Low-key database logging."
          echo "All episodes persisted directly to Firestore cloud database."
          echo "Video artifact archived securely in Actions run artifacts."
          echo "==============================================================="
