name: Cinema Vanguard - Episodic Movie Series Pipeline (Channel 4)

on:
  push:
    branches:
      - main
      - master
  # MOVIE CHANNEL PAUSED: Scheduled releases paused for now (Season 1 Finale Episode 4 complete)
  # schedule:
  #   - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      episode_index:
        description: 'Episode Index (0 = Ep 1, 1 = Ep 2, 2 = Ep 3, 3 = The Abyssal Trench [Ep 4 Finale])'
        required: false
        default: '3'
        type: string
      auto_publish:
        description: 'Publish Live to YouTube & TikTok (Default TRUE for Push & Manual)'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'Publish Live to TikTok via Buffer API 2 (Default TRUE)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run Mode (Do not upload or post to CDN)'
        required: true
        default: false
        type: boolean
      sound_url:
        description: 'Custom Soundtrack Audio URL (Optional)'
        required: false
        default: ''
        type: string

jobs:
  movie_brand_pipeline:
    name: Build & Render Episodic Mini-Movie Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg Media Engine & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Generate Episodic Movie Reel
        env:
          EPISODE_INDEX: ${{ github.event.inputs.episode_index || '3' }}
          AUTO_PUBLISH: ${{ github.event_name == 'push' && 'true' || github.event.inputs.auto_publish || 'true' }}
          DELETE_AFTER_UPLOAD: 'true'
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MOVIE_MUSIC_URL: ${{ github.event.inputs.sound_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 || secrets.YOUTUBE_REFRESH_TOKEN_CH1 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID }}
        run: |
          echo "=== 🎬 Generating Episodic Movie Reel (Episode 4 Finale / Index: $EPISODE_INDEX) ==="
          node scripts/generate_movie_brand_episode.cjs
          echo "=== Movie Episode Assembled & Processed Successfully ==="

      - name: Dispatch to Movie Brand TikTok Channel (Buffer API 2)
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.publish_tiktok != 'false')
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID || secrets.BUFFER_TIKTOK_MOVIE_CHANNEL || secrets.BUFFER_TIKTOK_CHANNEL_ID_MOVIE || secrets.BUFFER_TIKTOK_CHANNEL_ID_1 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 📱 Publishing Movie Episode to TikTok via Buffer API 2 ==="
          node scripts/publish_buffer_second_tiktok.cjs movie_brand

      - name: Delete Episode 4 Video Files Post-Upload
        if: always()
        run: |
          echo "=== 🗑️ Post-Upload Cleanup: Deleting Episode 4 video files as requested ==="
          rm -f rendered_videos/movie_episode* test_artifacts/movie_episodes/*.mp4 test_artifacts/movie_episodes/*.wav
          echo "=== Episode 4 Video Files Deleted Post-Upload ==="

      - name: Archive Movie Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-episode-reel-${{ github.run_id }}
          path: |
            test_artifacts/movie_episodes_manifest.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Pipeline Summary (Zero Git Commits, Low Key Database Logging)
        if: always()
        run: |
          echo "==============================================================="
          echo "PROTOCOL ZERO EPISODIC ENGINE PIPELINE COMPLETED"
          echo "Zero git commits made to repository - Low-key database logging."
          echo "All episodes persisted directly to Firestore cloud database."
          echo "Video artifact archived securely in Actions run artifacts."
          echo "==============================================================="
