name: Driftreel Documentary (YouTube Ch 4 + Driftreel TikTok)

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean
      publish_youtube:
        description: 'YouTube Ch4'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'TikTok Buffer API2 → Driftreel movie channel'
        required: false
        default: true
        type: boolean

jobs:
  documentary_pipeline:
    name: Driftreel documentary + Buffer TikTok
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/apply_all_content_system.cjs || true
      - name: Force center bold captions (keep style)
        run: node scripts/apply_center_captions.cjs || true
      - name: Wire live archive research (no seed vault)
        run: node scripts/apply_cinema_live_research.cjs
      - name: Driftreel clean (no WM / no follow CTA / no scene boxes) + quality
        run: |
          node scripts/apply_cinema_driftreel_fix.cjs || true
          node scripts/apply_cinema_watermark_strip.cjs || true
          node scripts/fix_channel_audio_visual_quality.cjs || true
      - name: Generate documentary
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PUBLISH_YOUTUBE: ${{ github.event.inputs.publish_youtube }}
          PUBLISH_TIKTOK: 'false'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID_CH4: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET_CH4: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN_CH4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: node scripts/generate_documentary_movie_reel.cjs
      - name: Restore Buffer GraphQL publisher + AI flags
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && (github.event.inputs.publish_tiktok == true || github.event.inputs.publish_tiktok == 'true' || github.event_name == 'schedule') }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/devmeziem/Hi/a00c9e83c801f94513ff002978558c5ee8c113bf/scripts/publish_buffer_second_tiktok.cjs" \
            -o scripts/publish_buffer_second_tiktok.cjs
          test -s scripts/publish_buffer_second_tiktok.cjs
          node scripts/apply_buffer_ai_flag.cjs || true
      - name: Buffer TikTok → Driftreel
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && (github.event.inputs.publish_tiktok == true || github.event.inputs.publish_tiktok == 'true' || github.event_name == 'schedule') }}
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_TOKEN_2: ${{ secrets.BUFFER_API_TOKEN_2 || secrets.BUFFER_API_KEY_2 }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID }}
          BUFFER_TIKTOK_DRIFTREEL_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CHANNEL_TARGET: movie_brand
          DRY_RUN: 'false'
        run: |
          mkdir -p rendered_videos
          if [ ! -f rendered_videos/driftreel_documentary_latest.mp4 ]; then
            if ls rendered_videos/documentary_movie_*.mp4 1>/dev/null 2>&1; then
              cp $(ls -t rendered_videos/documentary_movie_*.mp4 | head -1) rendered_videos/driftreel_documentary_latest.mp4
            fi
          fi
          test -f rendered_videos/driftreel_documentary_latest.mp4 || { echo "NO VIDEO"; exit 1; }
          ls -lh rendered_videos/driftreel_documentary_latest.mp4
          set +e
          OUT=$(node scripts/publish_buffer_second_tiktok.cjs movie_brand 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -qi "SKIPPING publishing\|CHANNEL_NAME_NOT_VERIFIED\|NO_TARGET_TIKTOK\|VIDEO_NOT_FOUND"; then
            echo "Buffer skipped — fail"
            exit 1
          fi
          if [ $CODE -ne 0 ]; then exit $CODE; fi
          if ! echo "$OUT" | grep -qi "Post ID\|Successfully scheduled\|Successfully posted\|Buffer Dispatch Recorded"; then
            echo "No Buffer success marker — fail"
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftreel-doc-${{ github.run_id }}
          path: rendered_videos/*
          if-no-files-found: ignore
