name: Cinema Vanguard - Documentary (YouTube Ch 4)

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean
      publish_youtube:
        description: 'YouTube Ch4'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'TikTok Buffer API2 (driftreel only)'
        required: false
        default: true
        type: boolean

jobs:
  documentary_pipeline:
    name: Cinema documentary (not paused movie season)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/apply_all_content_system.cjs || true
      - name: Documentary engine only (skip paused movie season)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PUBLISH_YOUTUBE: ${{ github.event.inputs.publish_youtube }}
          PUBLISH_TIKTOK: ${{ github.event.inputs.publish_tiktok }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID_CH4: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET_CH4: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN_CH4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_TOKEN_2: ${{ secrets.BUFFER_API_TOKEN_2 || secrets.BUFFER_API_KEY_2 }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          # NEVER the paused Season-1 movie episode generator
          node scripts/generate_documentary_movie_reel.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-doc-${{ github.run_id }}
          path: |
            rendered_videos/*
          if-no-files-found: ignore
