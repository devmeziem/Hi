name: Cinema Vanguard - Episodic Movie Series Pipeline (Channel 4)

on:
  push:
    branches:
      - main
  schedule:
    # Daily episode release at 18:00 UTC (19:00 WAT)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      episode_index:
        description: 'Episode Index (0 = Breach at Neon Gate, 1 = Rogue Syndicate, auto = Next in Series)'
        required: false
        default: 'auto'
        type: string
      auto_publish:
        description: 'Publish Live to YouTube (Default FALSE: held in PENDING_REVIEW for manual check)'
        required: true
        default: false
        type: boolean
      dry_run:
        description: 'Dry Run Mode (Do not upload or post to CDN)'
        required: true
        default: false
        type: boolean
      sound_url:
        description: 'Custom Soundtrack Audio URL (Optional)'
        required: false
        default: ''
        type: string

jobs:
  movie_brand_pipeline:
    name: Build & Render Episodic Mini-Movie Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg Media Engine & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Generate Episodic Movie Reel
        env:
          EPISODE_INDEX: ${{ github.event.inputs.episode_index || 'auto' }}
          AUTO_PUBLISH: ${{ github.event.inputs.auto_publish || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MOVIE_MUSIC_URL: ${{ github.event.inputs.sound_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 || secrets.YOUTUBE_REFRESH_TOKEN_CH1 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'voxawell' }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET || 'phwka7ak' }}
        run: |
          echo "=== 🎬 Generating Episodic Movie Reel (Index: $EPISODE_INDEX) ==="
          node scripts/generate_movie_brand_episode.cjs
          echo "=== Movie Episode Assembled Successfully ==="

      - name: Archive Movie Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-episode-reel
          path: |
            test_artifacts/movie_episodes/*.mp4
            test_artifacts/movie_episodes_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Pipeline Summary (Zero Git Commits, Low Key Database Logging)
        if: always()
        run: |
          echo "==============================================================="
          echo "PROTOCOL ZERO EPISODIC ENGINE PIPELINE COMPLETED"
          echo "Zero git commits made to repository - Low-key database logging."
          echo "All episodes persisted directly to Firestore cloud database."
          echo "Video artifact archived securely in Actions run artifacts."
          echo "==============================================================="
