name: Cinema Vanguard - Crime, Horror, Mystery & Episodic Cinema (YouTube Ch 4 & Driftreel TikTok)

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      documentary_topic_id:
        description: 'Topic ID'
        required: false
        default: ''
        type: string
      publish_youtube:
        description: 'YouTube Ch4'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'TikTok driftreel'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean

jobs:
  documentary_pipeline:
    name: Cinema Vanguard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/apply_all_content_system.cjs || true
      - run: node scripts/apply_cinema_quality_fix.cjs || true
      - name: Generate
        env:
          DOCUMENTARY_EPISODE_ID: ${{ github.event.inputs.documentary_topic_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PUBLISH_YOUTUBE: ${{ github.event.inputs.publish_youtube }}
          PUBLISH_TIKTOK: ${{ github.event.inputs.publish_tiktok }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID_CH4: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET_CH4: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN_CH4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          if [ -f scripts/generate_movie_brand_episode.cjs ]; then
            node scripts/generate_movie_brand_episode.cjs || node scripts/generate_documentary_movie_reel.cjs
          else
            node scripts/generate_documentary_movie_reel.cjs
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-${{ github.run_id }}
          path: |
            rendered_videos/*movie*
            rendered_videos/*cinema*
            rendered_videos/*doc*
          if-no-files-found: ignore
