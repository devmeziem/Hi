name: Driftreel Documentary (YouTube Ch 4 + Driftreel TikTok)

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean
      publish_youtube:
        description: 'YouTube Ch4'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'TikTok Buffer API2 → Driftreel (archie.the.explorer6)'
        required: false
        default: true
        type: boolean

jobs:
  documentary_pipeline:
    name: Driftreel history + folk story
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-liberation2 fonts-freefont-ttf || true
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: pip install -q edge-tts || true
      # NO apply_* patches on the generator — file is the source of truth
      - name: Verify Driftreel generator is clean
        run: |
          node --check scripts/generate_documentary_movie_reel.cjs
          grep -q "DRIFTREEL" scripts/generate_documentary_movie_reel.cjs
          ! grep -q "Cinema Vanguard" scripts/generate_documentary_movie_reel.cjs
          grep -q "Arial Black" scripts/generate_documentary_movie_reel.cjs
          grep -q "&H00000000,1,0,0,0,100,100" scripts/generate_documentary_movie_reel.cjs || grep -q "BackColour.*&H00000000" scripts/generate_documentary_movie_reel.cjs
          echo "Generator clean: Driftreel history, no Cinema Vanguard, Arial Black captions"
      - name: Generate documentary
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PUBLISH_YOUTUBE: ${{ github.event.inputs.publish_youtube }}
          PUBLISH_TIKTOK: 'false'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID_CH4: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET_CH4: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN_CH4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: node scripts/generate_documentary_movie_reel.cjs
      - name: Buffer TikTok → Driftreel
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && (github.event.inputs.publish_tiktok == true || github.event.inputs.publish_tiktok == 'true' || github.event_name == 'schedule') }}
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_TOKEN_2: ${{ secrets.BUFFER_API_TOKEN_2 || secrets.BUFFER_API_KEY_2 }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID }}
          BUFFER_TIKTOK_DRIFTREEL_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          CHANNEL_TARGET: movie_brand
          DRY_RUN: 'false'
        run: |
          mkdir -p rendered_videos
          test -f rendered_videos/driftreel_documentary_latest.mp4 || { echo NO_VIDEO; exit 1; }
          ls -lh rendered_videos/driftreel_documentary_latest.mp4
          # Restore known-good publisher then force Driftreel caption vars from manifest
          curl -fsSL "https://raw.githubusercontent.com/devmeziem/Hi/a00c9e83c801f94513ff002978558c5ee8c113bf/scripts/publish_buffer_second_tiktok.cjs" -o scripts/publish_buffer_second_tiktok.cjs
          node scripts/apply_buffer_ai_flag.cjs || true
          node scripts/apply_buffer_driftreel_caption.cjs || true
          node scripts/fix_shebang_headers.cjs || true
          # Hard inject caption from manifest so docTitle is always defined
          node -e "
            const fs=require('fs');
            let p=fs.readFileSync('scripts/publish_buffer_second_tiktok.cjs','utf8');
            let meta={title:'Driftreel History',era:'',excerpt:'Ancient history and folk tales.'};
            try{meta={...meta,...JSON.parse(fs.readFileSync('rendered_videos/driftreel_manifest.json','utf8'));}}catch(e){}
            const title=(meta.title||meta.episodeTitle||'Driftreel History').replace(/\x60/g,"'");
            const era=meta.era?(' · '+meta.era):'';
            const excerpt=String(meta.excerpt||meta.description||meta.story||'Ancient history and folk tales.').slice(0,160).replace(/\x60/g,"'");
            const caption='Driftreel · '+title+era+'\n\n'+excerpt+'...\n\nFollow for more ancient history & folk tales.\n\n#Driftreel #HistoryTok #AncientHistory #FolkTale #Documentary #Shorts #FYP';
            // Force movie_brand caption assignment
            p=p.replace(/#CinemaVanguard/g,'#Driftreel').replace(/Cinema Vanguard/gi,'Driftreel');
            p=p.replace(/allowComments:\s*(true|false),?/g,'').replace(/allowDuet:\s*(true|false),?/g,'').replace(/allowStitch:\s*(true|false),?/g,'');
            fs.writeFileSync('scripts/publish_buffer_second_tiktok.cjs',p);
            fs.writeFileSync('/tmp/drift_caption.txt', caption);
            console.log('CAPTION_PREVIEW', caption.slice(0,120));
          "
          # Export caption for publisher if it reads env
          export DRIFTREEL_CAPTION="$(cat /tmp/drift_caption.txt)"
          set +e
          OUT=$(node scripts/publish_buffer_second_tiktok.cjs movie_brand 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if echo "$OUT" | grep -qi "ReferenceError"; then echo CAPTION_SCOPE_BUG; exit 1; fi
          if echo "$OUT" | grep -qi "SKIPPING publishing\|CHANNEL_NAME_NOT_VERIFIED\|NO_TARGET_TIKTOK\|VIDEO_NOT_FOUND"; then exit 1; fi
          if [ $CODE -ne 0 ]; then exit $CODE; fi
          if ! echo "$OUT" | grep -qi "Post ID\|Successfully scheduled\|Successfully posted\|Buffer Dispatch Recorded"; then exit 1; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftreel-doc-${{ github.run_id }}
          path: |
            rendered_videos/*
            test_artifacts/documentary/**
          if-no-files-found: ignore
