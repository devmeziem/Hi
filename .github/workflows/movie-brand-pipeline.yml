name: Cinema Vanguard - Historical Archival Documentary Pipeline (Channel 4)

on:
  schedule:
    # Daily spaced archival documentary drops at 14:00 UTC
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      episode_id:
        description: 'Specific Documentary Topic ID (or leave blank for intelligent deduplication rotation)'
        required: false
        default: ''
        type: string
      auto_publish:
        description: 'Publish Live to YouTube Shorts (Channel 4)'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'Publish Live to TikTok via Buffer API 2'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run Mode (Render video locally without uploading)'
        required: true
        default: false
        type: boolean

jobs:
  documentary_pipeline:
    name: Build, Render & Dispatch Archival Documentary Video
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify or Install FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Execute Historical Documentary Engine
        env:
          DOCUMENTARY_EPISODE_ID: ${{ github.event.inputs.episode_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_CH4: ${{ secrets.YOUTUBE_CLIENT_ID_CH4 || secrets.YOUTUBE_CLIENT_ID_MOVIE || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET_CH4: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH4 || secrets.YOUTUBE_CLIENT_SECRET_MOVIE || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_CH4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH4 || secrets.YOUTUBE_REFRESH_TOKEN_MOVIE || secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_HANDLE_CH4: ${{ secrets.YOUTUBE_HANDLE_CH4 || secrets.YOUTUBE_HANDLE_MOVIE }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
        run: |
          echo "=== 🏛️ Generating Cinema Vanguard Archival Documentary Reel ==="
          node scripts/generate_documentary_movie_reel.cjs

      - name: Dispatch to Movie Brand TikTok Channel (Buffer API 2)
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event.inputs.publish_tiktok != 'false')
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_MOVIE_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_MOVIE_CHANNEL_ID || secrets.BUFFER_TIKTOK_MOVIE_CHANNEL || secrets.BUFFER_TIKTOK_CHANNEL_ID_MOVIE || secrets.BUFFER_TIKTOK_CHANNEL_ID_1 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 📱 Publishing Documentary Reel to TikTok via Buffer API 2 ==="
          node scripts/publish_buffer_second_tiktok.cjs movie_brand || true

      - name: Archive Documentary Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-movie-reel-${{ github.run_id }}
          path: |
            rendered_videos/documentary_*.mp4
            test_artifacts/documentary/
          if-no-files-found: ignore
          retention-days: 14

      - name: Pipeline Summary
        if: always()
        run: |
          echo "==============================================================="
          echo "CINEMA VANGUARD ARCHIVAL DOCUMENTARY PIPELINE COMPLETED"
          echo "Zero git commits made - Database & channel sync verified."
          echo "==============================================================="
