name: Test Stoic & Motivation Pipeline

on:
  schedule:
    # Strict 4x daily cadence: 1 Stoic Short (12:00 UTC) + 3 Reels of 3s/5s (07:00, 17:00, 22:00 UTC)
    - cron: '0 7,12,17,22 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic / Theme (Leave blank to auto-generate fresh unique topic)'
        required: false
        default: ''
        type: string
      video_mode:
        description: 'Video Generation Mode (auto | short | 3s_reel | 5s_reel | all_daily_4)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - short
          - 3s_reel
          - 5s_reel
          - all_daily_4
      dry_run:
        description: 'Dry Run Mode (Uncheck for live YouTube upload)'
        required: true
        default: false
        type: boolean

jobs:
  test_pipeline:
    name: Run Stoic Pipeline Diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg Media Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Discover and Cache Working AI Models (Groq & OpenRouter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== Discovering Active Groq & OpenRouter Models ==="
          node scripts/groq_model_finder.cjs || true
          node scripts/openrouter_model_finder.cjs || true

      - name: Execute Stoic Single Video (Paced 1 Video Per Trigger to Prevent Spam)
        env:
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'auto' }}
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          CONTENT_DEPTH: ${{ github.event.inputs.content_depth }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
          YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
          YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
          YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          FIRESTORE_API_KEY: ${{ secrets.FIRESTORE_API_KEY }}
        run: |
          CURRENT_HOUR=$(date -u +%-H)
          echo "=== Processing Stoic Video Dispatch (Mode: $VIDEO_MODE, Hour: $CURRENT_HOUR UTC) ==="
          
          if [ "$VIDEO_MODE" = "short" ] || { [ "$VIDEO_MODE" = "auto" ] && [ "$CURRENT_HOUR" -eq 12 ]; }; then
            echo "▶️ Generating 1 Stoic Animated Video Short..."
            node scripts/test_stoic_runner.cjs
          elif [ "$VIDEO_MODE" = "3s_reel" ] || { [ "$VIDEO_MODE" = "auto" ] && { [ "$CURRENT_HOUR" -eq 7 ] || [ "$CURRENT_HOUR" -eq 22 ]; }; }; then
            echo "▶️ Generating 1 Stoic 3-Second Mystery Quote Reel..."
            SHORT_DURATION=3.0 node scripts/generate_stoic_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "5s_reel" ] || { [ "$VIDEO_MODE" = "auto" ] && [ "$CURRENT_HOUR" -eq 17 ]; }; then
            echo "▶️ Generating 1 Stoic 5-Second Mystery Quote Reel..."
            SHORT_DURATION=5.0 node scripts/generate_stoic_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "all_daily_4" ]; then
            echo "▶️ Generating Full Daily 4-Video Suite (1 Short + 3 Reels)..."
            echo "--- Slot 1: 3-Second Mystery Reel ---"
            SHORT_DURATION=3.0 node scripts/generate_stoic_quote_reel.cjs || true
            echo "--- Slot 2: Full Animated Stoic Short ---"
            node scripts/test_stoic_runner.cjs || true
            echo "--- Slot 3: 5-Second Mystery Reel ---"
            SHORT_DURATION=5.0 node scripts/generate_stoic_quote_reel.cjs || true
            echo "--- Slot 4: 3-Second Mystery Reel ---"
            SHORT_DURATION=3.0 node scripts/generate_stoic_quote_reel.cjs || true
          else
            echo "▶️ Defaulting to Stoic Mystery Quote Reel..."
            SHORT_DURATION=5.0 node scripts/generate_stoic_quote_reel.cjs
          fi

      - name: Archive Stoic Daily Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoic-daily-short
          path: |
            rendered_videos/stoic_quote_5s_latest.mp4
            daily_blueprint_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit & Push Daily Blueprint Manifest & Weekly Keep-Alive
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/activity_logs
          LOG_FILE=".github/activity_logs/weekly_keepalive.md"
          
          # Perform weekly commit to keep GitHub Actions active
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF_DAYS=$(( (NOW - LAST_COMMIT_DATE) / 86400 ))
          DAY_OF_WEEK=$(date -u +%u) # 7 = Sunday
          
          if [ "$DIFF_DAYS" -ge 6 ] || [ "$DAY_OF_WEEK" -eq 7 ]; then
            echo "Weekly keepalive commit triggered (diff: $DIFF_DAYS days, day: $DAY_OF_WEEK)..."
            echo "# GitHub Actions Weekly Keepalive Log" > "$LOG_FILE"
            echo "Keepalive Heartbeat: $(date -u)" >> "$LOG_FILE"
            echo "Workflow: Stoic & Motivation (${{ github.run_number }})" >> "$LOG_FILE"
            git add "$LOG_FILE"
          fi
          
          if [ -f daily_blueprint_manifest.json ]; then
            git add -f daily_blueprint_manifest.json
          fi
          if [ -f stoic_quote_history.json ]; then
            git add -f stoic_quote_history.json
          fi
          
          if git diff --staged --quiet; then
            echo "No changes staged for commit."
          else
            git commit -m "chore(sync): automated stoic manifest and weekly keepalive [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Cleanup Local Temporary Media & Blobs
        if: always()
        run: |
          rm -rf test_artifacts/*.mp3 test_artifacts/*.wav test_artifacts/*.png test_artifacts/*.jpg test_artifacts/*.mp4
          rm -rf rendered_videos/*.mp4 /tmp/voxam_* /tmp/voice_* /tmp/slide_*
          echo "Cleaned up all runner temporary media blobs."
