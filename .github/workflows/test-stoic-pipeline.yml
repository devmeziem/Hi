name: Stoic 5-Second Quote Reel Pipeline

on:
  schedule:
    - cron: '0 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (Uncheck for live upload)'
        required: true
        default: false
        type: boolean
      scholar:
        description: 'Specific Scholar / Philosopher (Optional)'
        required: false
        default: ''
        type: string

jobs:
  stoic_reel_pipeline:
    name: Generate & Dispatch Stoic 5s Pure Quote Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin fonts-liberation
          fi
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: pip install -q edge-tts || true
      - name: Force fresh media + anti-spam + design/image rotation
        run: |
          node scripts/force_fresh_stoic_media.cjs || true
          node scripts/apply_stoic_anti_spam_rotation.cjs || true
          node scripts/apply_unique_bgm_all.cjs || true
          node scripts/fix_channel_audio_visual_quality.cjs || true
          node scripts/fix_tts_male_no_google_default.cjs || true
          node scripts/fix_stoic_shell_quote.cjs || true
      - name: Execute Stoic 5s Pure Quote (unique quote + image + BGM)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' }}
          SCHOLAR_FILTER: ${{ github.event.inputs.scholar }}
          SHORT_DURATION: '5.0'
          NO_VOICE: 'true'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 || secrets.YOUTUBE_CLIENT_ID_STOIC }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 || secrets.YOUTUBE_CLIENT_SECRET_STOIC }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 || secrets.YOUTUBE_REFRESH_TOKEN_STOIC || secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 || secrets.YOUTUBE_CLIENT_ID_STOIC }}
          YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 || secrets.YOUTUBE_CLIENT_SECRET_STOIC }}
          YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 || secrets.YOUTUBE_REFRESH_TOKEN_STOIC || secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_HANDLE_CH2: ${{ secrets.YOUTUBE_HANDLE_CH2 || secrets.YOUTUBE_HANDLE_STOIC }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          FIRESTORE_API_KEY: ${{ secrets.FIRESTORE_API_KEY }}
        run: |
          echo "=== Stoic 5s: unique quote + rotated design + image + soft piano ==="
          node scripts/generate_stoic_quote_reel.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoic-5s-${{ github.run_id }}
          path: |
            rendered_videos/stoic_quote_5s_latest.mp4
            rendered_videos/stoic_quote_*.mp4
          if-no-files-found: ignore
      - name: Commit dedup history (pull --rebase)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/topic_dedup_log.json stoic_quote_history.json data/bgm_use_history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No dedup changes"
            exit 0
          fi
          git commit -m "chore(dedup): stoic topic log [skip ci]" || true
          git pull --rebase origin main || git pull --rebase --autostash origin main || true
          git push origin HEAD:main || true
