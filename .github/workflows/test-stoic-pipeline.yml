name: Test Stoic & Motivation Pipeline

on:
  schedule:
    - cron: '0 1,6,11,16,21 * * *' # Automated 5x daily posts: 4x Shorts (06:00, 11:00, 16:00, 21:00 UTC) + 1x Deep Dive (01:00 UTC)
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic / Theme (Leave blank to auto-generate fresh unique topic)'
        required: false
        default: ''
        type: string
      content_depth:
        description: 'Content Depth & Duration'
        required: true
        default: 'short_form'
        type: choice
        options:
          - short_form
          - deep_dive
      dry_run:
        description: 'Dry Run Mode (Uncheck for live YouTube upload)'
        required: true
        default: false
        type: boolean

jobs:
  test_pipeline:
    name: Run Stoic Pipeline Diagnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund || npm install --force || true

      - name: Install FFmpeg Media Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Execute Stoic & Motivation Pipeline Diagnostic
        env:
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          CONTENT_DEPTH: ${{ github.event.inputs.content_depth || 'short_form' }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_KEY: ${{ secrets.GROK_KEY }}
          XAI_API_KEY_2: ${{ secrets.XAI_API_KEY_2 }}
          GROK_API_KEY_2: ${{ secrets.GROK_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
          YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
        run: node scripts/test_stoic_runner.cjs

      - name: Commit & Push Daily Blueprint Manifest to Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily_blueprint_manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to daily_blueprint_manifest.json."
          else
            git commit -m "chore(manifest): sync stoic posted video metadata [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Auto-commit push skipped or branch protected."
          fi

      - name: Cleanup Local Temporary Media & Blobs
        if: always()
        run: |
          rm -rf test_artifacts/*.mp3 test_artifacts/*.wav test_artifacts/*.png test_artifacts/*.jpg test_artifacts/*.mp4
          rm -rf rendered_videos/*.mp4 /tmp/voxam_* /tmp/voice_* /tmp/slide_*
          echo "Cleaned up all runner temporary media blobs."
