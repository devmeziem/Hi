name: Test Stoic & Motivation Pipeline

on:
  schedule:
    # 5x daily spaced drops: 03:00 UTC (30s deep psychology), 06:00 UTC (3s reel), 11:00 UTC (5s reel), 16:00 UTC (3s reel), 21:00 UTC (5s reel)
    # 5 daily drops maintaining optimal algorithm cadence and deep viewer psychological impact
    - cron: '0 3,6,11,16,21 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic / Theme (Leave blank to auto-generate fresh unique topic)'
        required: false
        default: ''
        type: string
      video_mode:
        description: 'Video Generation Mode (auto | short | 3s_reel | 5s_reel | psychology_short_30s | all_daily_5)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - psychology_short_30s
          - short
          - 3s_reel
          - 5s_reel
          - all_daily_5
      dry_run:
        description: 'Dry Run Mode (Uncheck for live YouTube upload)'
        required: true
        default: false
        type: boolean

jobs:
  test_pipeline:
    name: Run Stoic Pipeline Diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg Media Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Discover and Cache Working AI Models (Groq & OpenRouter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== Discovering Active Groq & OpenRouter Models ==="
          node scripts/groq_model_finder.cjs || true
          node scripts/openrouter_model_finder.cjs || true

      - name: Execute Stoic Single Video (Paced 1 Video Per Trigger to Prevent Spam)
        env:
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'auto' }}
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          CONTENT_DEPTH: ${{ github.event.inputs.content_depth }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
          YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 }}
          YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 }}
          YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          FIRESTORE_API_KEY: ${{ secrets.FIRESTORE_API_KEY }}
        run: |
          CURRENT_HOUR=$(date -u +%-H)
          echo "=== Processing Stoic Video Dispatch (Mode: $VIDEO_MODE, Hour: $CURRENT_HOUR UTC) ==="
          
          if [ "$VIDEO_MODE" = "psychology_short_30s" ] || { [ "$VIDEO_MODE" = "auto" ] && [ "$CURRENT_HOUR" -eq 3 ]; }; then
            echo "▶️ Generating 1 Stoic Deep Psychological Video (25-35s Action Law, Slot: $CURRENT_HOUR UTC)..."
            SHORT_DURATION=30.0 node scripts/generate_stoic_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "short" ]; then
            echo "▶️ Generating 1 Stoic Animated Video Short..."
            node scripts/test_stoic_runner.cjs
          elif [ "$VIDEO_MODE" = "3s_reel" ] || { [ "$VIDEO_MODE" = "auto" ] && { [ "$CURRENT_HOUR" -eq 6 ] || [ "$CURRENT_HOUR" -eq 16 ]; }; }; then
            echo "▶️ Generating 1 Stoic 3-Second Mystery Quote Reel (Slot: $CURRENT_HOUR UTC)..."
            SHORT_DURATION=3.0 node scripts/generate_stoic_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "5s_reel" ] || { [ "$VIDEO_MODE" = "auto" ] && { [ "$CURRENT_HOUR" -eq 11 ] || [ "$CURRENT_HOUR" -eq 21 ]; }; }; then
            echo "▶️ Generating 1 Stoic 5-Second Mystery Quote Reel (Slot: $CURRENT_HOUR UTC)..."
            SHORT_DURATION=5.0 node scripts/generate_stoic_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "all_daily_5" ] || [ "$VIDEO_MODE" = "all_daily_4" ]; then
            echo "▶️ Spaced Slot Trigger: Generating exactly 1 fresh, non-repeating video for current slot..."
            SHORT_DURATION=5.0 node scripts/generate_stoic_quote_reel.cjs
          else
            echo "▶️ Defaulting to Stoic Mystery Quote Reel..."
            SHORT_DURATION=5.0 node scripts/generate_stoic_quote_reel.cjs
          fi

      - name: Archive Stoic Daily Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoic-daily-short
          path: |
            rendered_videos/stoic_quote_5s_latest.mp4
            daily_blueprint_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Pipeline Summary (Zero Git Commits, Low Key Database Logging)
        if: always()
        run: |
          echo "==============================================================="
          echo "STOIC & MOTIVATION PIPELINE COMPLETED"
          echo "Zero git commits made to repository - Low-key database logging."
          echo "==============================================================="

      - name: Cleanup Local Temporary Media & Blobs
        if: always()
        run: |
          rm -rf test_artifacts/*.mp3 test_artifacts/*.wav test_artifacts/*.png test_artifacts/*.jpg test_artifacts/*.mp4
          rm -rf rendered_videos/*.mp4 /tmp/voxam_* /tmp/voice_* /tmp/slide_*
          echo "Cleaned up all runner temporary media blobs."
