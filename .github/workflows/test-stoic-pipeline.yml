name: Stoic 5-Second Quote Reel Pipeline

on:
  schedule:
    # 2x daily spaced drops for authentic 5s quote reels: 09:00 UTC and 21:00 UTC
    # User mandate: Author image, fade in, keep panning, fade out, configured audio, SEO search tags
    - cron: '0 9,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode (Uncheck for live upload)'
        required: true
        default: false
        type: boolean
      scholar:
        description: 'Specific Scholar / Philosopher (Optional, leave blank for auto-rotation)'
        required: false
        default: ''
        type: string

jobs:
  stoic_reel_pipeline:
    name: Generate & Dispatch Stoic 5s Quote Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify or Install FFmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin
          fi
          ffmpeg -version | head -n 1

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Execute Stoic 5-Second Reel Generator
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          SCHOLAR_FILTER: ${{ github.event.inputs.scholar }}
          SHORT_DURATION: '5.0'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 || secrets.YOUTUBE_CLIENT_ID_STOIC }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 || secrets.YOUTUBE_CLIENT_SECRET_STOIC }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 || secrets.YOUTUBE_REFRESH_TOKEN_STOIC || secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_CLIENT_ID_CH2: ${{ secrets.YOUTUBE_CLIENT_ID_CH2 || secrets.YOUTUBE_CLIENT_ID_STOIC }}
          YOUTUBE_CLIENT_SECRET_CH2: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH2 || secrets.YOUTUBE_CLIENT_SECRET_STOIC }}
          YOUTUBE_REFRESH_TOKEN_CH2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH2 || secrets.YOUTUBE_REFRESH_TOKEN_STOIC || secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_HANDLE_CH2: ${{ secrets.YOUTUBE_HANDLE_CH2 || secrets.YOUTUBE_HANDLE_STOIC }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          FIRESTORE_API_KEY: ${{ secrets.FIRESTORE_API_KEY }}
        run: |
          echo "=== 🏛️ Generating Authentic 5-Second Stoic Quote Reel ==="
          node scripts/generate_stoic_quote_reel.cjs

      - name: Archive Stoic Daily Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stoic-5s-quote-reel-${{ github.run_id }}
          path: |
            rendered_videos/stoic_quote_5s_latest.mp4
            rendered_videos/stoic_quote_*.mp4
            daily_blueprint_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Pipeline Summary
        if: always()
        run: |
          echo "==============================================================="
          echo "STOIC 5-SECOND QUOTE REEL PIPELINE COMPLETED"
          echo "Streamlined and clean - Zero bloat."
          echo "==============================================================="
