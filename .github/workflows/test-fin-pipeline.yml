name: Test Fin Blueprint Pipeline

on:
  schedule:
    # 5x daily spaced drops: 04:00 UTC (30s deep financial psychology), 07:00 UTC (3s reel), 12:00 UTC (5s reel), 17:00 UTC (3s reel), 22:00 UTC (5s reel)
    # Staggered 1 hour after Stoic drops to prevent API congestion & maintain ideal audience distribution
    - cron: '0 4,7,12,17,22 * * *'
  workflow_dispatch:
    inputs:
      video_mode:
        description: 'Video Mode (auto | fin_psychology_30s | 3s_reel | 5s_reel | all_daily_5)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - fin_psychology_30s
          - 3s_reel
          - 5s_reel
          - all_daily_5
      topic:
        description: 'Video Topic / Theme (Optional)'
        required: false
        default: ''
        type: string
      content_depth:
        description: 'Content Depth & Duration'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - short_form
          - deep_dive
      dry_run:
        description: 'Dry Run Mode (Uncheck for live YouTube/TikTok publishing)'
        required: true
        default: false
        type: boolean

jobs:
  test_fin_pipeline:
    name: Run Fin Blueprint Pipeline Diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg Media Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin imagemagick

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Discover and Cache Working AI Models (Groq & OpenRouter)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "=== Discovering Active Groq & OpenRouter Models ==="
          node scripts/groq_model_finder.cjs || true
          node scripts/openrouter_model_finder.cjs || true

      - name: Execute Fin Blueprint Pipeline (Content Creation or 5s Financial Quote Reel)
        env:
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'auto' }}
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          CONTENT_DEPTH: ${{ github.event.inputs.content_depth }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH1 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH1 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH1 || secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_CH1: ${{ secrets.YOUTUBE_CLIENT_ID_CH1 }}
          YOUTUBE_CLIENT_SECRET_CH1: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH1 }}
          YOUTUBE_REFRESH_TOKEN_CH1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH1 }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
        run: |
          CURRENT_HOUR=$(date -u +%-H)
          echo "=== Processing Video Dispatch (Mode: $VIDEO_MODE, Current UTC Hour: $CURRENT_HOUR) ==="
          
          if [ "$VIDEO_MODE" = "fin_psychology_30s" ] || { [ "$VIDEO_MODE" = "auto" ] && [ "$CURRENT_HOUR" -eq 4 ]; }; then
            echo "▶️ Generating 1 Fin Deep Psychological Video (25-35s Action Law, Slot: $CURRENT_HOUR UTC)..."
            SHORT_DURATION=30.0 node scripts/generate_fin_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "3s_reel" ] || { [ "$VIDEO_MODE" = "auto" ] && { [ "$CURRENT_HOUR" -eq 7 ] || [ "$CURRENT_HOUR" -eq 17 ]; }; }; then
            echo "▶️ Generating 1 Fin Reel (3 Seconds Duration, Slot: $CURRENT_HOUR UTC)..."
            SHORT_DURATION=3.0 node scripts/generate_fin_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "5s_reel" ] || { [ "$VIDEO_MODE" = "auto" ] && { [ "$CURRENT_HOUR" -eq 12 ] || [ "$CURRENT_HOUR" -eq 22 ]; }; }; then
            echo "▶️ Generating 1 Fin Reel (5 Seconds Duration, Slot: $CURRENT_HOUR UTC)..."
            SHORT_DURATION=5.0 node scripts/generate_fin_quote_reel.cjs
          elif [ "$VIDEO_MODE" = "all_daily_5" ] || [ "$VIDEO_MODE" = "all_daily_4" ]; then
            echo "▶️ Spaced Slot Trigger: Generating exactly 1 fresh, non-repeating fin reel for current slot..."
            SHORT_DURATION=5.0 node scripts/generate_fin_quote_reel.cjs
          else
            echo "▶️ Defaulting to 5-Second Fin Reel..."
            SHORT_DURATION=5.0 node scripts/generate_fin_quote_reel.cjs
          fi

      - name: Queue Generated Video to TikTok through Buffer
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_POST_TEXT: ${{ github.event.inputs.topic }}
          BUFFER_THUMBNAIL_OFFSET_MS: '2000'
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: node scripts/publish_fin_video_to_buffer_tiktok.cjs

      - name: Pipeline Summary (Zero Git Commits, Low Key Database Logging)
        if: always()
        run: |
          echo "==============================================================="
          echo "FINANCE BLUEPRINT PIPELINE COMPLETED"
          echo "Zero git commits made to repository - Low-key database logging."
          echo "==============================================================="

      - name: Cleanup Local Temporary Media & Blobs
        if: always()
        run: |
          rm -rf test_artifacts/*.mp3 test_artifacts/*.wav test_artifacts/*.png test_artifacts/*.jpg test_artifacts/*.mp4
          rm -rf rendered_videos/*.mp4 /tmp/voxam_* /tmp/voice_* /tmp/slide_*
          echo "Cleaned up all runner temporary media blobs."
