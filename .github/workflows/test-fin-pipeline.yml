name: Fin Blueprint Pipeline - Daily Mix (Channel 1)

on:
  schedule:
    # Daily mix (UTC):
    # 05:00 quote 5s | 11:00 quote 5s | 15:00 income teaching | 20:00 financial story doc
    - cron: '0 5,11,15,20 * * *'
  workflow_dispatch:
    inputs:
      video_mode:
        description: 'auto | quote | income | documentary'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - quote
          - income
          - documentary
      topic:
        description: 'Optional topic override'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run (no YouTube upload)'
        required: true
        default: false
        type: boolean

jobs:
  fin_blueprint_pipeline:
    name: Fin Blueprint daily slot (CH1)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg / espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng librsvg2-bin || true

      - name: Run Fin daily slot
        env:
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'auto' }}
          TEST_TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SHORT_DURATION: '5.0'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH1 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH1 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH1 || secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_CH1: ${{ secrets.YOUTUBE_CLIENT_ID_CH1 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET_CH1: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH1 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_CH1: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH1 || secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_HANDLE_CH1: ${{ secrets.YOUTUBE_HANDLE_CH1 || secrets.YOUTUBE_HANDLE_FIN }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
        run: |
          echo "=== Fin Blueprint slot (mode=$VIDEO_MODE) ==="
          node scripts/run_fin_daily_slot.cjs

      - name: Commit dedup logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fin_income_dedup.json data/topic_dedup_log.json fin_quote_history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(fin-dedup): rolling 30-day log [skip ci]" || true
            git push origin HEAD || true
          fi

      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-blueprint-${{ github.run_id }}
          path: |
            rendered_videos/fin_*.mp4
            rendered_videos/*fin*.mp4
            test_artifacts/fin_*
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit
        if: always()
        run: node scripts/workflow_audit_reporter.cjs fin_blueprint || true
