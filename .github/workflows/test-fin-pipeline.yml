name: Fin Blueprint Pipeline - Daily Mix (Channel 1) [PAUSED]

# PAUSED — schedule disabled while channel is redesigned.
# Manual runs still available via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      video_mode:
        description: 'Mode (education-first)'
        required: false
        default: 'skill'
        type: choice
        options: [auto, skill, trap, income, documentary, quote]
      dry_run:
        description: 'Dry Run'
        required: true
        default: true
        type: boolean

jobs:
  fin_slot:
    name: Fin education slot (CH1) [PAUSED]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Paused notice
        run: |
          echo "Fin channel is PAUSED for redesign."
          echo "No scheduled posts. Manual dispatch only (dry_run default true)."
          if [ "${{ github.event.inputs.dry_run }}" != "false" ] && [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            echo "dry_run is on — exiting without render. Set dry_run=false to force a test."
            exit 0
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg || true
      - run: pip install -q edge-tts
      - run: node scripts/apply_all_content_system.cjs || true
      - run: node scripts/ensure_youtube_dispatcher.cjs || true
      - name: Fix Fin TTS + male voice path + complete lessons
        run: |
          node scripts/fix_fin_archie_tts.cjs || true
          node scripts/fix_tts_male_no_google_default.cjs || true
          node scripts/fix_fin_complete_lessons.cjs || true
      - name: Run Fin education slot
        env:
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
          FIN_VOICE: en-US-AndrewNeural
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH1 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH1 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH1 || secrets.YOUTUBE_REFRESH_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: node scripts/run_fin_daily_slot.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-${{ github.run_id }}
          path: |
            rendered_videos/fin_*.mp4
            rendered_videos/fin_education_meta.json
          if-no-files-found: ignore
