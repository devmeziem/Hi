name: Fin Blueprint Pipeline - Daily Mix (Channel 1)

on:
  schedule:
    - cron: '0 5,11,15,20 * * *'
  workflow_dispatch:
    inputs:
      video_mode:
        description: 'Mode (education-first)'
        required: false
        default: 'skill'
        type: choice
        options: [auto, skill, trap, income, documentary, quote]
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean

jobs:
  fin_slot:
    name: Fin education slot (CH1)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg || true
      - run: node scripts/apply_all_content_system.cjs || true
      - run: node scripts/ensure_youtube_dispatcher.cjs || true
      - name: Run Fin education slot
        env:
          VIDEO_MODE: ${{ github.event.inputs.video_mode || 'auto' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH1 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH1 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH1 || secrets.YOUTUBE_REFRESH_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: node scripts/run_fin_daily_slot.cjs
      - name: Commit dedup history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fin_quote_history.json data/*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(fin-dedup): rolling history [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin HEAD || true
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin-${{ github.run_id }}
          path: |
            rendered_videos/fin_*.mp4
            rendered_videos/fin_education_meta.json
          if-no-files-found: ignore
