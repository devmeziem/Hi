name: Kaggle Clip Roundtrip (push + wait + download to GitHub)

# Full loop: write job → push kernel → wait for NEW complete → download MP4s
# → upload artifacts → commit under kaggle_clips/ so they live in the repo
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel / job type'
        required: false
        default: 'test'
        type: choice
        options: [test, archie, teen, stoic, driftreel, fin]
      num_clips:
        description: 'Number of 5s clips'
        required: false
        default: '2'
      wait_minutes:
        description: 'Max minutes to wait for kernel COMPLETE'
        required: false
        default: '25'

jobs:
  roundtrip:
    name: Kaggle push + download MP4s into GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -q 'kaggle>=1.6.0' six protobuf urllib3 certifi python-dateutil requests tqdm
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core || true

      - name: Build job.json + embed into notebook
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'test' }}
          NUM_CLIPS: ${{ github.event.inputs.num_clips || '2' }}
        run: |
          mkdir -p kaggle/ai_clip_worker
          python3 << 'PY'
          import json, time, os, pathlib, re
          ch = os.environ.get('CHANNEL', 'test')
          n = int(os.environ.get('NUM_CLIPS', '2'))
          prompts = [
            "cinematic vertical portrait soft light no text",
            "calm ambient environment vertical 9 16 no text",
            "friendly explorer character vertical studio soft light",
          ]
          job = {
            "job_id": f"gh-{os.environ.get('GITHUB_RUN_ID','local')}-{int(time.time())}",
            "channel": ch,
            "task": "test_roundtrip",
            "clip_seconds": 5,
            "num_clips": n,
            "prompts": prompts[:max(n, 1)],
            "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          path = pathlib.Path("kaggle/ai_clip_worker/job.json")
          path.write_text(json.dumps(job, indent=2))
          print("WROTE", path, job)

          # Embed job into notebook cell 0 as guaranteed source
          nb_path = pathlib.Path("kaggle/ai_clip_worker/ai_clip_worker.ipynb")
          nb = json.loads(nb_path.read_text())
          embed = {
            "cell_type": "code",
            "execution_count": None,
            "metadata": {},
            "outputs": [],
            "source": [
              "# EMBEDDED_JOB from GitHub Actions (always present)\n",
              "import json, pathlib\n",
              f"EMBEDDED_JOB = json.loads({json.dumps(json.dumps(job))})\n",
              "pathlib.Path('/kaggle/working').mkdir(parents=True, exist_ok=True)\n",
              "pathlib.Path('/kaggle/working/job.json').write_text(json.dumps(EMBEDDED_JOB, indent=2))\n",
              "print('EMBEDDED_JOB ok', EMBEDDED_JOB.get('job_id'))\n",
            ],
          }
          # Put embed cell first among code cells
          if nb.get("cells") and nb["cells"][0].get("cell_type") == "markdown":
            nb["cells"].insert(1, embed)
          else:
            nb["cells"].insert(0, embed)
          nb_path.write_text(json.dumps(nb, indent=1))
          print("Notebook embed OK")
          PY

      - name: Kaggle credentials + metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -e
          test -n "$KAGGLE_USERNAME"
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo -n "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          fi
          if [ -n "$KAGGLE_KEY" ]; then
            printf '%s\n' "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi
          python3 - << PY
          import json, os
          p="kaggle/ai_clip_worker/kernel-metadata.json"
          m=json.load(open(p))
          m["id"]=os.environ["KAGGLE_USERNAME"]+"/hi-ai-clip-worker"
          m["title"]="hi-ai-clip-worker"
          m["enable_gpu"]=True
          m["enable_internet"]=True
          m["is_private"]=True
          json.dump(m, open(p,"w"), indent=2)
          print("KERNEL", m["id"])
          PY
          echo "KERNEL_SLUG=$KAGGLE_USERNAME/hi-ai-clip-worker" >> $GITHUB_ENV

      - name: Snapshot status before push
        run: |
          BEFORE=$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)
          echo "BEFORE=$BEFORE"
          echo "STATUS_BEFORE<<EOF" >> $GITHUB_ENV
          echo "$BEFORE" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Push kernel (start GPU run)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set +e
          OUT=$(kaggle kernels push -p kaggle/ai_clip_worker 2>&1)
          CODE=$?
          echo "$OUT"
          echo "push_exit=$CODE"
          # validate notebook JSON was accepted
          if echo "$OUT" | grep -qi 'Expecting'; then
            echo "Notebook JSON invalid"; exit 1
          fi
          if [ $CODE -ne 0 ] && ! echo "$OUT" | grep -qi '409\|Conflict\|success\|Kernel'; then
            echo "push failed"; exit $CODE
          fi

      - name: Wait for NEW complete (not stale COMPLETE)
        env:
          WAIT_MIN: ${{ github.event.inputs.wait_minutes || '25' }}
        run: |
          set +e
          END=$((SECONDS + WAIT_MIN * 60))
          SAW_RUNNING=0
          while [ $SECONDS -lt $END ]; do
            OUT=$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)
            echo "$OUT"
            if echo "$OUT" | grep -qiE 'running|queued|pending|starting'; then
              SAW_RUNNING=1
              echo "saw running/queued"
            fi
            if echo "$OUT" | grep -qiE 'complete|completed|success'; then
              if [ "$SAW_RUNNING" = "1" ]; then
                echo "NEW COMPLETE after running"; break
              fi
              # if never saw running, still accept after 90s post-push (cold complete)
              if [ $SECONDS -gt 90 ]; then
                echo "COMPLETE accepted after wait window"; break
              fi
            fi
            if echo "$OUT" | grep -qiE 'error|failed'; && ! echo "$OUT" | grep -qi complete; then
              echo "kernel error"; exit 1
            fi
            sleep 20
          done

      - name: Download kernel output
        run: |
          mkdir -p kaggle_out kaggle_clips/latest
          kaggle kernels output "$KERNEL_SLUG" -p kaggle_out 2>&1 || true
          echo "=== downloaded ==="
          find kaggle_out -type f | head -80
          ls -laR kaggle_out || true
          # collect any mp4
          find kaggle_out -type f -iname '*.mp4' -exec cp -v {} kaggle_clips/latest/ \; || true
          find kaggle_out -type f -iname 'manifest.json' -exec cp -v {} kaggle_clips/latest/ \; || true

      - name: Fallback — generate MP4s on GitHub if Kaggle sent no video
        run: |
          COUNT=$(find kaggle_clips/latest -type f -iname '*.mp4' | wc -l)
          echo "mp4_count=$COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "No Kaggle MP4 — generating on GitHub Actions from job.json"
            python3 << 'PY'
          import json, pathlib, subprocess
          job = json.loads(pathlib.Path('kaggle/ai_clip_worker/job.json').read_text())
          outdir = pathlib.Path('kaggle_clips/latest')
          outdir.mkdir(parents=True, exist_ok=True)
          sec = float(job.get('clip_seconds') or 5)
          prompts = job.get('prompts') or ['vertical soft light']
          n = int(job.get('num_clips') or 2)
          colors = ['0x0f172a', '0x1e293b', '0x172554', '0x3b0764']
          clips = []
          for i in range(n):
              label = ' '.join(str(prompts[i % len(prompts)]).split())[:40].replace(':', ' ')
              color = colors[i % len(colors)]
              out = outdir / f'clip_{i:02d}.mp4'
              filt = (
                  f'color=c={color}:s=1080x1920:d={sec},'
                  f'drawbox=x=60:y=820:w=960:h=280:color=black@0.45:t=fill,'
                  f'drawtext=text={label}:fontsize=36:fontcolor=white:x=(w-text_w)/2:y=920'
              )
              cmd = ['ffmpeg','-y','-f','lavfi','-i',filt,'-c:v','libx264','-pix_fmt','yuv420p','-t',str(sec),str(out)]
              try:
                  subprocess.run(cmd, check=True, capture_output=True)
              except Exception as e:
                  subprocess.run(['ffmpeg','-y','-f','lavfi','-i',f'color=c=black:s=1080x1920:d={sec}','-c:v','libx264','-pix_fmt','yuv420p','-t',str(sec),str(out)], check=False)
              clips.append({'index': i, 'path': out.name, 'prompt': prompts[i % len(prompts)], 'bytes': out.stat().st_size if out.exists() else 0})
              print('made', out, out.stat().st_size if out.exists() else 0)
          (outdir / 'manifest.json').write_text(json.dumps({'job_id': job.get('job_id'), 'source': 'github_fallback', 'clips': clips, 'status': 'complete'}, indent=2))
          PY
          fi
          ls -la kaggle_clips/latest/

      - name: Commit clips into repo (live on GitHub)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p kaggle_clips/latest
          # keep only latest set (avoid repo bloat)
          git add kaggle_clips/latest/*.mp4 kaggle_clips/latest/manifest.json kaggle/ai_clip_worker/job.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(kaggle): clip outputs from run ${{ github.run_id }} [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
            echo "Committed clips to main under kaggle_clips/latest/"
          else
            echo "Nothing to commit"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kaggle-mp4s-${{ github.run_id }}
          path: |
            kaggle_clips/latest/**
            kaggle_out/**
          if-no-files-found: warn
