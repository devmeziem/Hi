name: Kaggle Clip Roundtrip (push + wait + download to GitHub)

# Always produces MP4s on GitHub even if Kaggle 409s.
# Tries Kaggle push/poll when possible; falls back to local ffmpeg clips.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel / job type'
        required: false
        default: 'test'
        type: choice
        options: [test, archie, teen, stoic, driftreel, fin]
      num_clips:
        description: 'Number of 5s clips'
        required: false
        default: '2'
      wait_minutes:
        description: 'Max minutes to wait for kernel COMPLETE'
        required: false
        default: '15'

jobs:
  roundtrip:
    name: Kaggle + GitHub MP4 clips
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install -q 'kaggle>=1.6.0' six protobuf urllib3 certifi python-dateutil requests tqdm
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Build job.json
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'test' }}
          NUM_CLIPS: ${{ github.event.inputs.num_clips || '2' }}
        run: |
          mkdir -p kaggle/ai_clip_worker kaggle_clips/latest
          python3 << 'PY'
          import json, time, os, pathlib
          ch = os.environ.get("CHANNEL", "test")
          n = max(1, int(os.environ.get("NUM_CLIPS", "2")))
          prompts = [
            "cinematic vertical portrait soft light no text",
            "calm ambient environment vertical 9 16 no text",
            "friendly explorer character vertical studio soft light",
            "moody documentary still vertical soft grain",
          ]
          job = {
            "job_id": f"gh-{os.environ.get('GITHUB_RUN_ID','local')}-{int(time.time())}",
            "channel": ch,
            "task": "test_roundtrip",
            "clip_seconds": 5,
            "num_clips": n,
            "prompts": prompts[:n],
            "created_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          path = pathlib.Path("kaggle/ai_clip_worker/job.json")
          path.write_text(json.dumps(job, indent=2))
          print("WROTE", path, job["job_id"])
          PY

      - name: Always generate MP4s on GitHub first (guaranteed)
        run: |
          python3 << 'PY'
          import json, pathlib, subprocess, shlex
          job = json.loads(pathlib.Path("kaggle/ai_clip_worker/job.json").read_text())
          outdir = pathlib.Path("kaggle_clips/latest")
          outdir.mkdir(parents=True, exist_ok=True)
          # clear old clips in latest
          for old in outdir.glob("clip_*.mp4"):
              old.unlink(missing_ok=True)
          sec = float(job.get("clip_seconds") or 5)
          prompts = job.get("prompts") or ["vertical soft light"]
          n = int(job.get("num_clips") or 2)
          colors = ["0x0f172a", "0x1e293b", "0x172554", "0x3b0764", "0x111827"]
          clips = []
          for i in range(n):
              label = " ".join(str(prompts[i % len(prompts)]).split())[:36]
              # escape for drawtext
              safe = label.replace(":", "\\:").replace("'", "")
              color = colors[i % len(colors)]
              out = outdir / f"clip_{i:02d}.mp4"
              vf = (
                  f"color=c={color}:s=1080x1920:d={sec},"
                  f"drawbox=x=50:y=800:w=980:h=300:color=black@0.4:t=fill,"
                  f"drawtext=text='{safe}':fontsize=34:fontcolor=white:x=(w-text_w)/2:y=900"
              )
              cmd = [
                  "ffmpeg", "-y", "-f", "lavfi", "-i", vf,
                  "-c:v", "libx264", "-pix_fmt", "yuv420p", "-t", str(sec), str(out)
              ]
              r = subprocess.run(cmd, capture_output=True, text=True)
              if r.returncode != 0 or not out.exists() or out.stat().st_size < 1000:
                  # ultra-simple fallback
                  subprocess.run([
                      "ffmpeg", "-y", "-f", "lavfi", "-i", f"color=c={color}:s=1080x1920:d={sec}",
                      "-c:v", "libx264", "-pix_fmt", "yuv420p", "-t", str(sec), str(out)
                  ], check=False)
              clips.append({
                  "index": i,
                  "path": out.name,
                  "prompt": prompts[i % len(prompts)],
                  "bytes": out.stat().st_size if out.exists() else 0,
              })
              print("made", out, clips[-1]["bytes"])
          manifest = {
              "job_id": job.get("job_id"),
              "source": "github_actions_cpu",
              "clips": clips,
              "status": "complete",
          }
          (outdir / "manifest.json").write_text(json.dumps(manifest, indent=2))
          print("manifest", manifest)
          PY
          ls -la kaggle_clips/latest/

      - name: Kaggle credentials (optional path)
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          if [ -z "$KAGGLE_USERNAME" ]; then
            echo "No KAGGLE_USERNAME — skip Kaggle path"
            exit 0
          fi
          mkdir -p ~/.kaggle
          if [ -n "$KAGGLE_API_TOKEN" ]; then
            echo -n "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
            chmod 600 ~/.kaggle/access_token
          fi
          if [ -n "$KAGGLE_KEY" ]; then
            printf '%s\n' "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
            chmod 600 ~/.kaggle/kaggle.json
          fi
          python3 - << 'PY'
          import json, os
          p = "kaggle/ai_clip_worker/kernel-metadata.json"
          m = json.load(open(p))
          m["id"] = os.environ["KAGGLE_USERNAME"] + "/hi-ai-clip-worker"
          m["title"] = "hi-ai-clip-worker"
          m["enable_gpu"] = True
          m["enable_internet"] = True
          m["is_private"] = True
          json.dump(m, open(p, "w"), indent=2)
          print("KERNEL", m["id"])
          PY
          echo "KERNEL_SLUG=$KAGGLE_USERNAME/hi-ai-clip-worker" >> "$GITHUB_ENV"

      - name: Try Kaggle push (409 is OK)
        continue-on-error: true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          if [ -z "${KERNEL_SLUG:-}" ]; then
            echo "skip push"
            exit 0
          fi
          OUT=$(kaggle kernels push -p kaggle/ai_clip_worker 2>&1)
          CODE=$?
          echo "$OUT"
          echo "push_exit=$CODE"
          # 409 Conflict = kernel version locked / concurrent — not fatal
          if echo "$OUT" | grep -qi '409\|Conflict'; then
            echo "409 Conflict — kernel busy or same version; will still poll/download"
          fi
          if echo "$OUT" | grep -qi 'Expecting'; then
            echo "Notebook JSON invalid"
          fi

      - name: Poll Kaggle status briefly
        continue-on-error: true
        env:
          WAIT_MIN: ${{ github.event.inputs.wait_minutes || '8' }}
        run: |
          set +e
          if [ -z "${KERNEL_SLUG:-}" ]; then exit 0; fi
          END=$((SECONDS + WAIT_MIN * 60))
          while [ $SECONDS -lt $END ]; do
            OUT=$(kaggle kernels status "$KERNEL_SLUG" 2>&1 || true)
            echo "$OUT"
            case "$OUT" in
              *running*|*queued*|*pending*|*starting*) echo saw_active ;;
              *COMPLETE*|*complete*|*success*) echo done; break ;;
              *error*|*ERROR*|*failed*) echo kernel_err; break ;;
            esac
            sleep 25
          done

      - name: Download Kaggle output if any
        continue-on-error: true
        run: |
          set +e
          if [ -z "${KERNEL_SLUG:-}" ]; then exit 0; fi
          mkdir -p kaggle_out
          kaggle kernels output "$KERNEL_SLUG" -p kaggle_out 2>&1 || true
          find kaggle_out -type f -iname '*.mp4' -exec cp -v {} kaggle_clips/latest/ \; || true
          find kaggle_out -type f -iname 'manifest.json' -exec cp -v {} kaggle_clips/latest/kaggle_manifest.json \; || true
          ls -laR kaggle_out || true

      - name: Commit clips to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kaggle_clips/latest/*.mp4 kaggle_clips/latest/manifest.json kaggle/ai_clip_worker/job.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(kaggle): clips from run ${{ github.run_id }} [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main || true
            echo "Committed under kaggle_clips/latest/"
          else
            echo "Nothing to commit"
          fi
          ls -la kaggle_clips/latest/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: kaggle-mp4s-${{ github.run_id }}
          path: |
            kaggle_clips/latest/**
            kaggle_out/**
          if-no-files-found: warn
