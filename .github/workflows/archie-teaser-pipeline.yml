name: Archie Daily Q&A Teaser & Showdown Pipeline (PAUSED)

# PAUSED: low algo performance / boring format. Manual only until explainer format is healthy.
on:
  workflow_dispatch:
    inputs:
      test_topic:
        description: 'Custom Question Topic (Optional)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry Run Mode'
        required: false
        default: true
        type: boolean

jobs:
  archie_qa_teaser_pipeline:
    name: Build & Validate Archie Q&A Teaser (manual only)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin
          fi
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Execute Archie Q&A (manual)
        env:
          TEST_TOPIC: ${{ github.event.inputs.test_topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID_CH3: ${{ secrets.YOUTUBE_CLIENT_ID_CH3 || secrets.YOUTUBE_CLIENT_ID_TECH }}
          YOUTUBE_CLIENT_SECRET_CH3: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH3 || secrets.YOUTUBE_CLIENT_SECRET_TECH }}
          YOUTUBE_REFRESH_TOKEN_CH3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH3 || secrets.YOUTUBE_REFRESH_TOKEN_TECH }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID || '6aa31cd2cd8b9c702c468b52' }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID || '6aa31c1dcd8b9c702c467a38' }}
        run: |
          echo "=== Q&A pipeline is PAUSED by default (manual only) ==="
          node scripts/generate_archie_qa_teaser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archie-qa-teaser-output-${{ github.run_id }}
          path: |
            rendered_videos/archie_3in1_teaser_*.mp4
            rendered_videos/archie_qa_teaser_*.mp4
            test_artifacts/archie_qa/*
          if-no-files-found: ignore
          retention-days: 7
