name: Apex Discipline - Teen & Youth Motivation Pipeline (Channel 5)

on:
  schedule:
    - cron: '0 4,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video Format'
        required: false
        default: 'situation'
        type: choice
        options: ['situation', 'auto', 'long_form', '5s_reel', '15s_slam']
      topic:
        description: 'Topic (optional)'
        required: false
        default: ''
        type: string
      auto_publish:
        description: 'Publish YouTube'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'Publish TikTok Buffer API 2'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean

jobs:
  teen_motivation_pipeline:
    name: Build & Render Teen Motivation Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Apply content system volumes
        run: node scripts/apply_all_content_system.cjs || true
      - name: Generate Teen (situation-led, Motivation Andrew)
        env:
          VIDEO_TYPE: ${{ github.event.inputs.video_type || 'situation' }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH5 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH5 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH5 || secrets.YOUTUBE_REFRESH_TOKEN }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_TOKEN_2: ${{ secrets.BUFFER_API_TOKEN_2 || secrets.BUFFER_API_KEY_2 }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          # Prefer situation engine (no listicle seeds). Fallback to legacy if missing.
          if [ -f scripts/generate_teen_situation_reel.cjs ]; then
            node scripts/generate_teen_situation_reel.cjs
          else
            node scripts/apply_teen_quality_fix.cjs || true
            node scripts/generate_teen_motivation_reel.cjs
          fi
      - name: Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-${{ github.run_id }}
          path: |
            rendered_videos/teen_motivation_latest.mp4
            test_artifacts/teen_situation/**
          if-no-files-found: ignore
