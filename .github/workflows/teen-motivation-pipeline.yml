name: Apex Discipline - Teen & Youth Motivation Pipeline (Channel 5)

on:
  schedule:
    # 4 Posts Daily:
    # 04:00 UTC (05:00 WAT) -> 32s Emotionally Impactful Long-Form Video (Soft Piano + Dark Blank Quote Ending Screen)
    # 08:00 UTC (09:00 WAT) -> 5s straight-to-point reel
    # 14:00 UTC (15:00 WAT) -> 15s public opinion vs reality slam reel
    # 20:00 UTC (21:00 WAT) -> 5s straight-to-point reel
    - cron: '0 4,8,14,20 * * *'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video Format (auto = slot-based 4/day, long_form = 32s emotional narrative with soft piano, 5s_reel = 5s punchline, 15s_slam = 15s debate slam)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'long_form'
          - '5s_reel'
          - '15s_slam'
      topic:
        description: 'Topic or Theme (Optional - auto picks high-impact teen wisdom & psychology)'
        required: false
        default: ''
        type: string
      auto_publish:
        description: 'Publish Live to YouTube (Default TRUE for automated daily publishing)'
        required: true
        default: true
        type: boolean
      publish_tiktok:
        description: 'Publish Live to TikTok via Buffer API 2 (Default TRUE)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run Mode (Do not upload or post to CDN)'
        required: true
        default: false
        type: boolean
      sound_url:
        description: 'Custom Background Audio URL (Optional)'
        required: false
        default: ''
        type: string

jobs:
  teen_motivation_pipeline:
    name: Build & Render Teen Motivation Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg Media Engine & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Generate Teen Motivation Reel (Black & White with Layered Sound Effects)
        env:
          VIDEO_TYPE: ${{ github.event.inputs.video_type || 'auto' }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SKIP_BUFFER_DISPATCH: 'true'
          MOTIVATION_MUSIC_URL: ${{ github.event.inputs.sound_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID || secrets.BUFFER_TIKTOK_TEEN_CHANNEL || '6ab05677ea19ca0bde9c3ffb' }}
        run: |
          echo "=== Generating Teen Motivation Reel in Noir B&W (Type: $VIDEO_TYPE, Topic: $TOPIC) ==="
          node scripts/generate_teen_motivation_reel.cjs
          echo "=== Motivation Reel Assembled Successfully ==="

      - name: Dispatch to Teen Motivation TikTok Channel (Buffer API 2)
        if: success() && (github.event_name == 'schedule' || github.event.inputs.publish_tiktok != 'false')
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID || secrets.BUFFER_TIKTOK_TEEN_CHANNEL || '6ab05677ea19ca0bde9c3ffb' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Publishing Teen Motivation Reel to TikTok (6ab05677ea19ca0bde9c3ffb) via Buffer API 2 ==="
          node scripts/publish_buffer_second_tiktok.cjs teen_motivation

      - name: Archive Motivation Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-motivation-reel-${{ github.run_id }}
          path: |
            rendered_videos/teen_motivation_latest.mp4
            test_artifacts/motivation_reels/*.mp4
            test_artifacts/teen_motivation_manifest.json
            test_artifacts/last_workflow_audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit Rolling 30-Day Topic Deduplication Log
        if: always()
        run: |
          if [ -f data/topic_dedup_log.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/topic_dedup_log.json
            if ! git diff --staged --quiet; then
              git commit -m "chore(dedup): rolling 30-day topic log update [skip ci]"
              git push origin HEAD || true
              echo "Committed rolling 30-day dedup log to GitHub."
            else
              echo "Dedup log unchanged."
            fi
          fi

      - name: Plain-English Audit & Execution Summary
        if: always()
        run: |
          node scripts/workflow_audit_reporter.cjs teen_motivation
