name: Apex Discipline - Teen & Youth Motivation Pipeline (Channel 5)

on:
  push:
    branches:
      - main
  schedule:
    # Daily evening motivation drop at 20:00 UTC (21:00 WAT)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic or Theme (Leave empty to auto-fetch public wisdom + AI rewrite for teens)'
        required: false
        default: ''
        type: string
      auto_publish:
        description: 'Publish Live to YouTube (Default FALSE: held in PENDING_REVIEW for manual check)'
        required: true
        default: false
        type: boolean
      publish_tiktok:
        description: 'Publish Live to TikTok via Buffer API 2 (Default TRUE)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run Mode (Do not upload or post to CDN)'
        required: true
        default: false
        type: boolean
      sound_url:
        description: 'Custom Background Audio URL (Optional)'
        required: false
        default: ''
        type: string

jobs:
  teen_motivation_pipeline:
    name: Build & Render Teen Motivation Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install FFmpeg Media Engine & Audio Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Verify FFmpeg Installation
        run: ffmpeg -version

      - name: Generate Teen Motivation Reel
        env:
          TOPIC: ${{ github.event.inputs.topic || '' }}
          AUTO_PUBLISH: ${{ github.event.inputs.auto_publish || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MOTIVATION_MUSIC_URL: ${{ github.event.inputs.sound_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID_CH5 || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH5 || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH5 || secrets.YOUTUBE_REFRESH_TOKEN_CH1 }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID || secrets.BUFFER_TIKTOK_TEEN_CHANNEL || secrets.BUFFER_TIKTOK_CHANNEL_ID_5 || secrets.BUFFER_TIKTOK_CHANNEL_ID_TEEN || secrets.BUFFER_TIKTOK_CHANNEL_ID_2 || secrets.BUFFER_TIKTOK_MOTIVATION_CHANNEL_ID || secrets.BUFFER_TIKTOK_YOUTH_CHANNEL_ID || secrets.BUFFER_CHANNEL_ID_TEEN || secrets.BUFFER_CHANNEL_ID_5 || secrets.TIKTOK_TEEN_CHANNEL_ID }}
        run: |
          echo "=== 🔥 Generating Teen Motivation Reel (Topic: $TOPIC) ==="
          node scripts/generate_teen_motivation_reel.cjs
          echo "=== Motivation Reel Assembled Successfully ==="

      - name: Dispatch to Teen Motivation TikTok Channel (Buffer API 2)
        if: success() && (github.event_name == 'schedule' || github.event.inputs.publish_tiktok != 'false')
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 || secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID || secrets.BUFFER_TIKTOK_TEEN_CHANNEL || secrets.BUFFER_TIKTOK_CHANNEL_ID_5 || secrets.BUFFER_TIKTOK_CHANNEL_ID_TEEN || secrets.BUFFER_TIKTOK_CHANNEL_ID_2 || secrets.BUFFER_TIKTOK_MOTIVATION_CHANNEL_ID || secrets.BUFFER_TIKTOK_YOUTH_CHANNEL_ID || secrets.BUFFER_CHANNEL_ID_TEEN || secrets.BUFFER_CHANNEL_ID_5 || secrets.TIKTOK_TEEN_CHANNEL_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 📱 Publishing Teen Motivation Reel to TikTok via Buffer API 2 ==="
          node scripts/publish_buffer_second_tiktok.cjs teen_motivation

      - name: Archive Motivation Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-motivation-reel
          path: |
            rendered_videos/teen_motivation_latest.mp4
            test_artifacts/motivation_reels/*.mp4
            test_artifacts/teen_motivation_manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Pipeline Summary (Zero Git Commits, Low Key Database Logging)
        if: always()
        run: |
          echo "==============================================================="
          echo "TEEN MOTIVATION REELS PIPELINE COMPLETED"
          echo "Zero git commits made to repository - Low-key database logging."
          echo "Video artifact archived securely in Actions run artifacts."
          echo "==============================================================="
