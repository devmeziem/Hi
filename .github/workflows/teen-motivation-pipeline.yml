name: Apex Discipline - Teen & Youth Motivation Pipeline (Channel 5)

# SPAM STOP: schedule disabled until caption/TTS letter-S bug is verified fixed on a dry run
on:
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video Format'
        required: false
        default: 'situation'
        type: choice
        options: ['situation', 'auto', 'long_form', '5s_reel', '15s_slam']
      topic:
        description: 'Topic (optional)'
        required: false
        default: ''
        type: string
      auto_publish:
        description: 'Publish YouTube (requires CH5 secrets — default OFF)'
        required: true
        default: false
        type: boolean
      publish_tiktok:
        description: 'Publish TikTok bonesceo (default OFF until quality verified)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry Run (no publish)'
        required: true
        default: true
        type: boolean

jobs:
  teen_motivation_pipeline:
    name: Build & Render Teen Motivation Reel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core || true
      - name: Apply S-letter fix + quality + YT guard
        run: |
          node scripts/apply_all_content_system.cjs || true
          node scripts/ensure_youtube_dispatcher.cjs || true
          node scripts/fix_teen_s_letter_and_stop_spam.cjs
          node scripts/apply_teen_situation_quality.cjs || true
      - name: Generate Teen (dry by default)
        env:
          VIDEO_TYPE: ${{ github.event.inputs.video_type || 'situation' }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' || github.event.inputs.dry_run == '' }}
          SKIP_BUFFER: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          YOUTUBE_CLIENT_ID_CH5: ${{ secrets.YOUTUBE_CLIENT_ID_CH5 }}
          YOUTUBE_CLIENT_SECRET_CH5: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH5 }}
          YOUTUBE_REFRESH_TOKEN_CH5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH5 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          node scripts/generate_teen_situation_reel.cjs
          test -f rendered_videos/teen_motivation_latest.mp4
          # Prove letter S survives in captions file
          if ls test_artifacts/teen_situation/cap_*.ass 1>/dev/null 2>&1; then
            echo '--- ASS sample ---'
            head -30 test_artifacts/teen_situation/cap_*.ass | tail -20
            if grep -qiE '\\kf|\\k[0-9]' test_artifacts/teen_situation/cap_*.ass; then
              echo 'FAIL: karaoke tags still present'; exit 1
            fi
            if ! grep -qS 'S' test_artifacts/teen_situation/cap_*.ass; then
              echo 'WARN: no letter S in ASS (script may lack S words)'
            else
              echo 'OK: letter S present in ASS'
            fi
          fi
          cat rendered_videos/teen_motivation_meta.json | head -50 || true
      - name: YouTube (OFF unless auto_publish + CH5 secrets)
        continue-on-error: true
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && github.event.inputs.auto_publish == true }}
        env:
          YOUTUBE_CLIENT_ID_CH5: ${{ secrets.YOUTUBE_CLIENT_ID_CH5 }}
          YOUTUBE_CLIENT_SECRET_CH5: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH5 }}
          YOUTUBE_REFRESH_TOKEN_CH5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH5 }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID_CH5" ]; then echo 'No CH5 secrets — skip YT'; exit 0; fi
          node scripts/ensure_youtube_dispatcher.cjs || true
          node scripts/fix_teen_s_letter_and_stop_spam.cjs || true
          node -e "
            const fs=require('fs');
            const meta=JSON.parse(fs.readFileSync('rendered_videos/teen_motivation_meta.json','utf8'));
            const mod=require('./scripts/youtube_channel_dispatcher.cjs');
            if (typeof mod.uploadYouTubeShort!=='function') process.exit(0);
            mod.uploadYouTubeShort({
              videoPath:'rendered_videos/teen_motivation_latest.mp4',
              title:String(meta.title||'Teen').slice(0,95),
              description:String(meta.description||''),
              tags:(meta.hashtags||[]).map(h=>String(h).replace(/^#/,'')),
              channelId:'teen_motivation'
            }).then(r=>console.log(r)).catch(e=>console.warn(e.message));
          "
      - name: Buffer TikTok (OFF by default)
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && github.event.inputs.publish_tiktok == true }}
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_TOKEN_2: ${{ secrets.BUFFER_API_TOKEN_2 || secrets.BUFFER_API_KEY_2 }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID || '6ab05677ea19ca0bde9c3ffb' }}
          CHANNEL_TARGET: teen_motivation
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: 'false'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/devmeziem/Hi/a00c9e83c801f94513ff002978558c5ee8c113bf/scripts/publish_buffer_second_tiktok.cjs" -o scripts/publish_buffer_second_tiktok.cjs || true
          node scripts/publish_buffer_second_tiktok.cjs teen_motivation
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-${{ github.run_id }}
          path: |
            rendered_videos/teen_motivation_latest.mp4
            rendered_videos/teen_motivation_meta.json
            test_artifacts/teen_situation/**
          if-no-files-found: ignore
