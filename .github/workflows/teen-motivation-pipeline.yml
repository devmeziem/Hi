name: Apex Discipline - Teen & Youth Motivation Pipeline (Channel 5)

# 2 × PD-cartoon lesson (35-40s) + 1 × 5s stoic-psych loop per day
on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video Format — 5s_reel = stoic-psych loop for teens'
        required: false
        default: 'situation'
        type: choice
        options: ['situation', 'auto', '5s_reel']
      topic:
        description: 'Topic (optional)'
        required: false
        default: ''
        type: string
      auto_publish:
        description: 'Publish YouTube (CH5 secrets only — default OFF)'
        required: true
        default: false
        type: boolean
      publish_tiktok:
        description: 'Publish TikTok bonesceo'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run (no publish)'
        required: true
        default: false
        type: boolean

jobs:
  teen_motivation_pipeline:
    name: Build Teen Motivation (PD cartoon lesson / 5s loop)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-liberation2 fonts-freefont-ttf || true
      - run: pip install -q edge-tts
      - name: Verify PD cartoon generator
        run: |
          node --check scripts/generate_teen_situation_reel.cjs
          grep -q "PD_CARTOON_LESSON_BANK" scripts/generate_teen_situation_reel.cjs
          grep -q "Popeye" scripts/generate_teen_situation_reel.cjs
          echo "Teen PD cartoon lesson generator OK"
      - name: Generate Teen
        env:
          VIDEO_TYPE: ${{ github.event.inputs.video_type || '' }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true' }}
          SKIP_BUFFER: 'true'
          BOOST_DURATION: '5.0'
          TEEN_MAX_SEC: '40'
          TEEN_VOICE: en-US-AndrewNeural
          TEEN_RATE: '-8%'
          TEEN_PITCH: '-18Hz'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY || secrets.GROK_API_KEY }}
          YOUTUBE_CLIENT_ID_CH5: ${{ secrets.YOUTUBE_CLIENT_ID_CH5 }}
          YOUTUBE_CLIENT_SECRET_CH5: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH5 }}
          YOUTUBE_REFRESH_TOKEN_CH5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH5 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || secrets.UNSPLASH_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          HOUR=$(date -u +%H)
          VT="${VIDEO_TYPE}"
          if [ -z "$VT" ] || [ "$VT" = "auto" ]; then
            case "$HOUR" in
              15) VT=5s_reel ;;
              *) VT=situation ;;
            esac
          fi
          echo "VIDEO_TYPE=$VT HOUR=$HOUR"
          if [ "$VT" = "5s_reel" ] || [ "$VT" = "boost" ]; then
            echo "=== Teen BOOST 5s loop ==="
            if [ -f scripts/generate_teen_boost_5s_reel.cjs ]; then
              node scripts/generate_teen_boost_5s_reel.cjs
              test -f rendered_videos/teen_boost_5s_latest.mp4
              cp -f rendered_videos/teen_boost_5s_latest.mp4 rendered_videos/teen_motivation_latest.mp4
            else
              echo "5s generator missing — falling back to situation"
              node scripts/generate_teen_situation_reel.cjs
            fi
          else
            echo "=== Teen PD-cartoon lesson 35-40s ==="
            node scripts/generate_teen_situation_reel.cjs
          fi
          test -f rendered_videos/teen_motivation_latest.mp4
          cat rendered_videos/teen_motivation_meta.json | head -40 || true
      - name: YouTube (CH5 only)
        continue-on-error: true
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && (github.event.inputs.auto_publish == true || github.event.inputs.auto_publish == 'true') }}
        env:
          YOUTUBE_CLIENT_ID_CH5: ${{ secrets.YOUTUBE_CLIENT_ID_CH5 }}
          YOUTUBE_CLIENT_SECRET_CH5: ${{ secrets.YOUTUBE_CLIENT_SECRET_CH5 }}
          YOUTUBE_REFRESH_TOKEN_CH5: ${{ secrets.YOUTUBE_REFRESH_TOKEN_CH5 }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID_CH5" ]; then echo 'No CH5 — skip YT'; exit 0; fi
          node -e "
            const fs=require('fs');
            const meta=JSON.parse(fs.readFileSync('rendered_videos/teen_motivation_meta.json','utf8'));
            const mod=require('./scripts/youtube_channel_dispatcher.cjs');
            if (typeof mod.uploadYouTubeShort!=='function') process.exit(0);
            mod.uploadYouTubeShort({
              videoPath:'rendered_videos/teen_motivation_latest.mp4',
              title:String(meta.title||'Teen').slice(0,95),
              description:String(meta.description||''),
              tags:(meta.hashtags||[]).map(h=>String(h).replace(/^#/,'')),
              channelId:'teen_motivation'
            }).then(r=>console.log(r)).catch(e=>console.warn(e.message));
          "
      - name: Buffer TikTok bonesceo
        if: ${{ github.event.inputs.dry_run != true && github.event.inputs.dry_run != 'true' && (github.event.inputs.publish_tiktok == true || github.event.inputs.publish_tiktok == 'true' || github.event_name == 'schedule') }}
        env:
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          BUFFER_API_TOKEN_2: ${{ secrets.BUFFER_API_TOKEN_2 || secrets.BUFFER_API_KEY_2 }}
          BUFFER_TIKTOK_TEEN_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_TEEN_CHANNEL_ID || '6ab05677ea19ca0bde9c3ffb' }}
          CHANNEL_TARGET: teen_motivation
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          DRY_RUN: 'false'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/devmeziem/Hi/a00c9e83c801f94513ff002978558c5ee8c113bf/scripts/publish_buffer_second_tiktok.cjs" -o scripts/publish_buffer_second_tiktok.cjs || true
          node scripts/apply_buffer_ai_flag.cjs || true
          node scripts/fix_shebang_headers.cjs || true
          if [ -f rendered_videos/teen_motivation_meta.json ]; then
            export TEEN_POST_TITLE=$(node -e "console.log(JSON.parse(require('fs').readFileSync('rendered_videos/teen_motivation_meta.json','utf8')).title||'')")
            export TEEN_POST_DESCRIPTION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('rendered_videos/teen_motivation_meta.json','utf8')).description||'')")
          fi
          node scripts/patch_buffer_teen_caption.cjs || true
          node scripts/fix_shebang_headers.cjs || true
          node scripts/publish_buffer_second_tiktok.cjs teen_motivation
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teen-${{ github.run_id }}
          path: |
            rendered_videos/teen_motivation_latest.mp4
            rendered_videos/teen_boost_5s_latest.mp4
            rendered_videos/teen_motivation_meta.json
            test_artifacts/teen_situation/**
            test_artifacts/teen_boost_5s/**
          if-no-files-found: ignore
