      <rect x="328" y="942" width="95" height="10" rx="3" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5" />
      <line x1="365" y1="926" x2="395" y2="926" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    

