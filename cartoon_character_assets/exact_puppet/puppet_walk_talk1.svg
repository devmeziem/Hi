       <circle cx="232" cy="217" r="1.2" fill="#ffffff" opacity="0.7" />
    <ellipse cx="275" cy="215" rx="15" ry="13" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
       <!-- Iris -->
       <circle cx="280" cy="215" r="8.5" fill="#382218" stroke="#1c1917" stroke-width="1.5" />
