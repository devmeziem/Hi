    <path d="M 244 249 Q 250 254 256 249" stroke="#d09564" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="242" cy="249" r="1.5" fill="#451a03" />
    <circle cx="258" cy="249" r="1.5" fill="#451a03" />

    <!-- Mouth -->
    
      
    <!-- Natural Upper Lip with Graceful Cupid's Bow -->
